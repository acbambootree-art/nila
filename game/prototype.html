  harvest: { t: 0.7, beat: 0.35, n: 4, y: 2,  col: ['#9ad0e0', '#e8f4ff'], sfx: () => SFX.splash(), tool: 'basket', anim: ['harvest-a', 'harvest-b'] },

// ---- map, after the real farm off Pulau Ubin: a floating shed platform (west), a grid of walkways with net pens between (east) ----
const land = (r, c) => r >= 1 && c >= 1 && r <= 6 && c <= 5;

const expandDir = (r, c) => { const A = FR0 + 3 * S.farm.a, B = FC0 + 3 * S.farm.b;

const tankCap = () => TANK_LV[S.tankLv].cap, tankFull = () => S.tank.length >= tankCap();
const isClean = o => (Date.now() - o.at) / 1000 >= DEP / (up('generator') ? 1.1 : 1);
const isBroken = (r, c) => S.broken.some(([i, j]) => i === r && j === c);
const walkable = (r, c) => ((land(r, c) || lane(r, c)) && !isBroken(r, c)) || deck(r, c);
const inMap = (r, c) => r >= 0 && c >= 0 && r < MAP && c < MAP;

  cash: 40, xp: 0, level: 1, farm: { a: 1, b: 2 }, up: {}, plots: Array.from({ length: MAP }, () => Array(MAP).fill(null)),

S.broken = S.broken || []; S.lastBreak = S.lastBreak || Date.now();

if (S.sale) { if (S.sale.cash && !S.sale.paid) S.cash += S.sale.cash; S.sale = null; } // closed mid-sale: the buyer paid anyway

const IMG = {};
['oyster-baby-idle', 'oyster-baby-blink', 'oyster-medium-idle', 'oyster-medium-blink', 'oyster-fat-idle', 'oyster-fat-blink', 'sp-withered', 'sp-pearl', 'sp-gold', 'sea-crab-a', 'customer-wait', 'customer-happy',

const cv = document.getElementById('c'), g = cv.getContext('2d');
// backing store at an integer multiple of 640×360 so text renders sharp; sprites stay blocky via nearest sampling
function fit() { const k = Math.min(4, Math.max(1, Math.ceil(cv.getBoundingClientRect().width * devicePixelRatio / W))); cv.width = W * k; cv.height = H * k; g.setTransform(k, 0, 0, k, 0, 0); g.imageSmoothingEnabled = false; }
fit(); addEventListener('resize', fit);
const hits = [];
const hit = (x, y, w, h, fn) => hits.push({ x, y, w, h, fn });
const ready = n => { const im = IMG[n]; return im && im.complete && im.naturalWidth ? im : null; };
function text(s, x, y, color = C.sand, size = 8, align = 'left') { size = Math.max(size, 7); g.font = `${size}px monospace`; g.textAlign = align; g.fillStyle = '#0c0c0e'; g.fillText(s, x + 1, y + 1); g.fillStyle = color; g.fillText(s, x, y); g.textAlign = 'left'; }
function ell(x, y, rx, ry, color) { g.fillStyle = color; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); }
// a sprite with one rectangular part animated: the rest is drawn still, the part is redrawn by fn (in sprite-local pixels)

// ---- update ----

  const bed = S.objs.find(o => o.id === 'dog'); if (bed && !DOG) DOG = actor({ r: bed.r, c: bed.c, speed: 1.9 }); if (!bed) DOG = null;
  const home = S.objs.find(o => o.id === 'cat'); if (home && !CAT) CAT = actor({ r: home.r, c: home.c, speed: 0.7, pose: 'sleep' }); if (!home) CAT = null;
  if (DOG && (!PLAY || PLAY.phase === 'gather')) stepActor(dt, DOG); if (DOG && !PLAY) dogThink(DOG, dt, bed);
  if (CAT && !PLAY) { stepActor(dt, CAT); catThink(CAT, dt); } stepPlay(dt);
  for (const f of A.fish) { f.x += f.v * dt; if (f.x > 520) f.x = -520; if (f.x < -520) f.x = 520; if (Math.random() < 0.004) f.v = -f.v; }
  for (const j of A.jelly) { j.y -= 4 * dt; if (j.y < -20) j.y = 520; j.x += Math.sin(S.t + j.ph) * 3 * dt; }
  for (const b of A.gulls) { b.x += b.v * dt; if (b.x > W + 40) b.x = -40; if (b.x < -40) b.x = W + 40; }
  for (const c of A.clouds) { c.x += c.v * dt; if (c.x > W + 60) c.x = -80; }
  if (Math.random() < dt * 2) A.bubbles.push({ x: rnd(-500, 500), y: rnd(0, 520), v: rnd(8, 16), r: rnd(1, 2.5), life: 3 });
  for (const b of A.bubbles) { b.y -= b.v * dt; b.x += Math.sin(S.t * 3 + b.y) * 6 * dt; b.life -= dt; } A.bubbles = A.bubbles.filter(b => b.life > 0);
  for (const r of A.ripples) { r.r += 30 * dt; r.life -= dt * 1.2; } A.ripples = A.ripples.filter(r => r.life > 0);
  for (const f of A.floaters) { f.y -= 10 * dt; f.life -= dt * 0.8; } A.floaters = A.floaters.filter(f => f.life > 0);
  for (const p of A.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt; p.life -= dt; } A.particles = A.particles.filter(p => p.life > 0);
  for (const h of A.hops) { h.y += h.vy * dt; h.vy += 160 * dt; h.life -= dt; } A.hops = A.hops.filter(h => h.life > 0);
}

function drawAlbum() {
  const w = 54, cols = 5, x0 = W - 6 - cols * w, y0 = 22; panelBox(x0 - 6, y0, cols * w + 12, 22 + Math.ceil(ALBUM.length / cols) * 56);

    if (im) { const s = Math.min(1, 28 / im.height, 40 / im.width); g.globalAlpha = n ? 1 : 0.12; g.drawImage(im, Math.round(x - im.width * s / 2), Math.round(y + 30 - im.height * s), Math.round(im.width * s), Math.round(im.height * s)); g.globalAlpha = 1; }

function drawHutPanel() {
  const cap = up('bigshed') ? 3 : 1, row1 = [{ name: 'Daily gift', sub: giftReady() ? `S$${25 * S.level} · +10xp · tap to claim` : 'claimed · back tomorrow', desc: 'Free coins once a real day. Worth more at higher levels.', fn: claimGift, ok: giftReady() },

    const x = x0 + i * w + 6, tx = x + (k.id ? 34 : 6); g.fillStyle = k.done ? '#1f3a2a' : '#1a2a40'; g.fillRect(x, cy, w - 12, h);
    if (k.id) sprite(`wk-${k.id}-front-idle`, x + 17, cy + 58);

}
function drawTankPanel() {

  const w = 360, h = 132, x0 = W / 2 - w / 2, y0 = H / 2 - 70; panelBox(x0, y0, w, h); text('Depuration tank', W / 2, y0 + 14, C.gold2, 8, 'center');
  wrap(`Oysters must purge in UV-cleaned seawater before they can be sold. Harvests wait here ${fmt(DEP)}, then sell.`, w - 24).forEach((l, i) => text(l, x0 + 12, y0 + 30 + i * 10, C.grey, 7));

  btn(x0 + 12, clean.length ? `Sell ${clean.length} · S$${cash}` : 'Nothing clean yet', 'the buyer\'s boat comes to collect', clean.length > 0, () => sellTank(F));
  btn(x0 + 186, nx ? `Bigger tank S$${nx.cost}` : 'Tank maxed', nx ? (S.level < nx.lvl ? `unlocks at level ${nx.lvl}` : `holds ${nx.cap} instead of ${tankCap()}`) : `holds ${tankCap()}`, !!nx && S.level >= nx.lvl && S.cash >= nx.cost, upgradeTank);

function drawBoatPanel() {
  const w = 150, n = BOAT.trips.length, x0 = W / 2 - n * w / 2, y0 = H / 2 - 40; panelBox(x0 - 6, y0, w * n + 12, 80); text('Send the bumboat out', W / 2, y0 + 14, C.gold2, 8, 'center');

    text(`${tr.name} · ${tr.h} h`, x, y0 + 38, locked ? C.grey : C.sand, 8, 'center'); text(locked ? 'needs the Ubin jetty' : `costs S$${tr.cost}`, x, y0 + 50, locked ? C.grey : S.cash < tr.cost ? C.pink : C.gold2, 7, 'center'); text(`crate ≈ S$${tr.cash} · +${tr.xp}xp`, x, y0 + 62, C.grey, 6, 'center');

function drawQuests() {
  panelBox(W - 230, 22, 220, 34 + 14 * S.quests.length); text('Today\'s quests', W - 220, 36, C.gold2, 8);
  S.quests.forEach((q, i) => { const y = 50 + i * 14, p = questProg(q); text(q.text, W - 220, y, C.sand, 7); text(`${p}/${q.n}`, W - 80, y, p >= q.n ? C.gold : C.grey, 7, 'right'); text(`S$${q.cash} +${q.xp}xp`, W - 18, y, C.gold2, 6, 'right'); });
}
function draw() {
  hits.length = 0; const t = S.t, D = sky();
  drawWater(t, D);
  drawWorld(t, D);

  g.fillStyle = D.tint; g.globalAlpha = D.ta; g.fillRect(0, 0, W, H); g.globalAlpha = 1;
  for (const c of A.clouds) sprite(`sc-${c.k}`, c.x, c.y, { alpha: 0.5, scale: 1.5 });
  for (const b of A.gulls) sprite(Math.floor(t * 4 + b.ph) % 2 ? 'sea-gull-a' : 'sea-gull-b', b.x, b.y + Math.sin(t * 1.5 + b.ph) * 2, { flip: b.v < 0, scale: 0.7, alpha: 0.85 });

  if (S.panel === 'hut') drawHutPanel();
  if (S.panel === 'tank') drawTankPanel();
  for (const f of A.floaters) if (f.ui) { g.globalAlpha = Math.min(1, f.life); text(f.s, f.x, f.y, f.color, f.size, 'center'); } g.globalAlpha = 1;
  g.fillStyle = '#0c0c0eb0'; g.fillRect(0, 0, W, 18);
  text(`S$${S.cash}`, 8, 13, C.gold2, 11);
  const a = lvlXp(S.level), b = lvlXp(S.level + 1), k = (S.xp - a) / (b - a);
  text(`Lv ${S.level}`, 150, 13, C.sand, 9, 'right'); g.fillStyle = '#2b3a50'; g.fillRect(156, 6, 80, 6); g.fillStyle = '#9ad0e0'; g.fillRect(156, 6, Math.round(80 * k), 6); text(`${S.xp}/${b}`, 242, 13, C.grey, 7);
  text(`${S.farm.a * S.farm.b} pens`, 300, 13, C.sand, 8, 'center'); if (S.bottles) text(`🍾 ${S.bottles}`, 350, 13, C.gold2, 8, 'center');

  btn(410, 'album', S.panel === 'album', () => { S.panel = S.panel === 'album' ? null : 'album'; S.build = null; SFX.pop(); });
  btn(470, 'quests', S.panel === 'quests', () => { S.panel = S.panel === 'quests' ? null : 'quests'; S.build = null; SFX.pop(); });
  btn(530, 'build', S.panel === 'build', () => { S.panel = S.panel === 'build' ? null : 'build'; S.build = null; S.pick = null; SFX.pop(); });

    g.fillStyle = C.ink + 'cc'; g.fillRect(20, 320, 140, 24); text('Reserve a bottle', 90, 336, C.gold, 10, 'center'); hit(20, 320, 140, 24, () => window.open(NILA_LINK, '_blank'));
    g.fillRect(480, 320, 140, 24); text('Keep farming', 550, 336, C.sand, 10, 'center'); hit(480, 320, 140, 24, () => { S.won = false; });

}

// ---- input: drag pans the camera, a short press taps ----
let press = null;
const toCanvas = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
cv.addEventListener('pointerleave', () => { hover = null; });
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); const [x, y] = toCanvas(e); press = { x, y, cx: cam.x, cy: cam.y, drag: false }; audio(); });
let hover = null;
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { const [hx, hy] = toCanvas(e); hover = { x: hx, y: hy }; }
  if (!press) return; const [x, y] = toCanvas(e), dx = x - press.x, dy = y - press.y;
  if (!press.drag && Math.hypot(dx, dy) > 6) press.drag = true;
  if (press.drag) { cam.x = Math.max(-(MAP - 2) * TW / 2, Math.min((MAP - 2) * TW / 2, press.cx - dx)); cam.y = Math.max(20, Math.min((MAP - 1) * TH, press.cy - dy)); }
});
cv.addEventListener('pointerup', e => {
  if (!press) return; const was = press; press = null; if (was.drag) { save(); return; }
  const x = was.x, y = was.y, h = [...hits].reverse().find(h => x >= h.x && x < h.x + h.w && y >= h.y && y < h.y + h.h);
  if (h) { h.fn(); save(); return; }
  if (S.won) return;
  if (S.pick || S.pickFish) { S.pick = null; S.pickFish = null; return; }
  const tl = tileAt(x, y);
  if (tl && inMap(tl.r, tl.c)) { tapTile(tl.r, tl.c); save(); return; }
  const wx = x - W / 2 + cam.x, wy = y - H / 2 + cam.y; A.ripples.push({ x: wx, y: wy, r: 2, life: 1 }); SFX.splash();
});
if (up('generator') && !S.objs.some(o => o.id === 'generator')) placeFree('generator'); // older saves drew it beside the shed
if (up('bigshed')) clearFootprint();
refreshQuests();
{ breakPlanks(); let n = 0; for (const row of S.plots) for (const p of row) if (p && growth(p) >= 1 && !withered(p)) n++; const w = S.plots.flat().filter(p => p && withered(p)).length, b = S.broken.length, cl = S.tank.filter(isClean).length; if (n || w || b || cl) setTimeout(() => float([n && `${n} ready`, cl && `${cl} clean in the tank`, w && `${w} withered`, b && `${b} planks to fix`].filter(Boolean).join(', ') + ' while you were away', W / 2, 100, C.gold, 10, true), 600); }
let last = performance.now();
(function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt); draw(); music(); requestAnimationFrame(loop); })(last);
