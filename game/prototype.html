<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indigo Tides</title>
<style>
  html, body { margin: 0; background: #0c0c0e; }
  #wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
  canvas { width: 100%; image-rendering: pixelated; display: block; touch-action: none; border-radius: 6px; box-shadow: 0 20px 60px #000a; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="640" height="360"></canvas></div>
<script>
// ---- tuning ----
const SP = [ // oyster species: grow seconds, spat price, sale, xp, unlock level, tint
  { id: 'rock',     name: 'Rock',     time: 60,        cost: 5,   sell: 12,   xp: 3,   lvl: 1, tint: null },
  { id: 'pacific',  name: 'Pacific',  time: 5 * 60,    cost: 15,  sell: 45,   xp: 8,   lvl: 2, tint: '#7fb8d8' },
  { id: 'kumamoto', name: 'Kumamoto', time: 30 * 60,   cost: 40,  sell: 170,  xp: 25,  lvl: 4, tint: '#a8d8a0' },
  { id: 'pearl',    name: 'Pearl',    time: 4 * 3600,  cost: 150, sell: 900,  xp: 120, lvl: 6, tint: '#f1c4cf' },
  { id: 'belon',    name: 'Belon',    time: 12 * 3600, cost: 500, sell: 3500, xp: 400, lvl: 8, tint: '#c9a96e' },
];
const ITEMS = [ // buildable: on land or sea; pens have a feed→wait→collect cycle; effects are read where they apply
  { id: 'lantern',  name: 'Lantern',     cost: 60,   xp: 5,   lvl: 1, on: 'land', sprite: 'bld-lantern' },
  { id: 'fishcage', name: 'Fish cage',   cost: 150,  xp: 10,  lvl: 2, on: 'sea',  sprite: 'pen-fishcage', pen: { feed: 20, time: 20 * 60, sell: 90, xp: 15, what: 'fish' } },
  { id: 'bench',    name: 'Bench',       cost: 80,   xp: 6,   lvl: 2, on: 'land', sprite: 'bld-bench' },
  { id: 'palm',     name: 'Palm',        cost: 120,  xp: 10,  lvl: 2, on: 'land', sprite: 'bld-palm' },
  { id: 'crabpen',  name: 'Crab pen',    cost: 250,  xp: 15,  lvl: 3, on: 'land', sprite: 'pen-crabpen', pen: { feed: 40, time: 3600, sell: 220, xp: 35, what: 'crabs' } },
  { id: 'stall',    name: 'Market',      cost: 500,  xp: 40,  lvl: 3, on: 'land', sprite: 'bld-stall', note: '+10% sales' },
  { id: 'flag',     name: 'Flag',        cost: 200,  xp: 15,  lvl: 3, on: 'land', sprite: 'bld-flag' },
  { id: 'cat',      name: 'Cat',         cost: 300,  xp: 25,  lvl: 4, on: 'land', sprite: 'bld-cat' },
  { id: 'shed',     name: 'Shed',        cost: 800,  xp: 60,  lvl: 5, on: 'land', sprite: 'bld-shed', note: 'withers 2× slower' },
  { id: 'cellar',   name: 'NILA cellar', cost: 400,  xp: 50,  lvl: 5, on: 'sea',  sprite: 'cellar', pen: { feed: 100, time: 6 * 3600, sell: 0, xp: 300, what: 'bottle', win: true } },
];
const EXPAND = { 4: [150, 2], 5: [500, 4], 6: [1500, 6], 7: [4000, 8] };
const ALBUM = [ // collection book entries; counts live in S.album
  ...SP.map(s => ({ id: s.id, name: s.name, icon: () => tinted('oyster-fat-idle', s.tint) })),
  { id: 'fish', name: 'Fish', icon: () => ready('sea-fish1-a') }, { id: 'crabs', name: 'Crabs', icon: () => ready('sea-crab-a') }, { id: 'bottle', name: 'NILA', icon: () => ready('bottle-3') },
  { id: 'rarepearl', name: 'Pearl drop', icon: () => ready('sp-pearl'), rare: true }, { id: 'gold', name: 'Gold shell', icon: () => ready('sp-gold'), rare: true },
];
const RARE = { rarepearl: { odds: 0.05, cash: 60, sprite: 'sp-pearl', label: 'pearl' }, gold: { odds: 0.01, cash: 400, sprite: 'sp-gold', label: 'GOLD' } }; // per harvest
const BOAT = { r: 5, c: 7, trips: [{ h: 2, cost: 30, cash: 150, xp: 20 }, { h: 8, cost: 100, cash: 800, xp: 90 }] };
const NILA_LINK = 'https://nila.wine';
const W = 640, H = 360, TW = 64, TH = 32, MAP = 16, R0 = 4, C0 = 8, MAXN = 7, daySeconds = 300, WALK = 2.6;
const lvlXp = L => L <= 1 ? 0 : Math.round(30 * Math.pow(L - 1, 1.7));
const C = { sand: '#f5f0e8', gold: '#c9a96e', gold2: '#d4bc8a', deep: '#a8884f', ink: '#0c0c0e', pink: '#f1c4cf', green: '#5f9a6a', wood: '#6b4f3a', wood2: '#8a6a4a', grey: '#8a9ab0' };
const rnd = (a, b) => a + Math.random() * (b - a);

// ---- map: a kelong island top-left, a deck, the raft growing to the lower right ----
const land = (r, c) => r >= 1 && c >= 1 && r <= 6 && c <= 6 && r + c <= 10;
const grass = (r, c) => land(r, c) && r <= 5 && c <= 5 && r + c <= 8;
const deck = (r, c) => r === 4 && c === 7;
const raft = (r, c) => r >= R0 && c >= C0 && r < R0 + S.n && c < C0 + S.n;
const raftZone = (r, c) => r >= R0 && c >= C0 && r < R0 + MAXN && c < C0 + MAXN;
const HUT = { r: 2, c: 2 }; // 2×2 footprint ending at this tile
const hutTile = (r, c) => r >= 1 && r <= 2 && c >= 1 && c <= 2;
const walkable = (r, c) => land(r, c) || deck(r, c) || raft(r, c);
const inMap = (r, c) => r >= 0 && c >= 0 && r < MAP && c < MAP;

const S = load() || {
  cash: 40, xp: 0, level: 1, n: 3, plots: Array.from({ length: MAXN }, () => Array(MAXN).fill(null)),
  objs: [], bottles: 0, won: false, step: 0, quests: [], questDay: '', stats: { harvest: {}, collect: 0, built: 0 },
  farmer: { r: 3, c: 4 }, cam: null, album: {}, boat: { out: null, trip: 0 },
};
S.album = S.album || {}; S.boat = S.boat || { out: null, trip: 0 };
Object.assign(S, { t: daySeconds * 0.75, pick: null, build: null, panel: null });
const F = Object.assign({ tr: null, tc: null, queue: [], walk: 0, back: false, flip: false, moving: false }, S.farmer); S.farmer = F;
const cam = S.cam || { x: 60, y: 150 }; S.cam = cam;
const A = { fish: [], jelly: [], bubbles: [], ripples: [], floaters: [], particles: [], gulls: [], clouds: [], hops: [] };
for (let i = 0; i < 14; i++) A.fish.push({ kind: 1 + (i % 3), x: rnd(-500, 500), y: rnd(0, 500), v: rnd(10, 26) * (Math.random() < 0.5 ? 1 : -1), ph: rnd(0, 6) });
for (let i = 0; i < 3; i++) A.jelly.push({ x: rnd(-400, 400), y: rnd(100, 450), ph: rnd(0, 6) });
for (let i = 0; i < 3; i++) A.gulls.push({ x: rnd(0, W), y: rnd(20, 120), v: rnd(14, 22) * (i % 2 ? -1 : 1), ph: rnd(0, 6) });
[['cloud1', 40, 40, 3], ['cloud2', 300, 70, 2], ['cloud3', 520, 30, 4]].forEach(([k, x, y, v]) => A.clouds.push({ k, x, y, v }));

function load() { try { return JSON.parse(localStorage.getItem('indigo-farm-v2')); } catch { return null; } }
function save() { try { const { t, pick, build, panel, ...rest } = S; rest.farmer = { r: F.r, c: F.c }; localStorage.setItem('indigo-farm-v2', JSON.stringify(rest)); } catch {} }

// ---- sprites ----
const IMG = {};
['oyster-baby-idle', 'oyster-baby-blink', 'oyster-medium-idle', 'oyster-medium-blink', 'oyster-fat-idle', 'oyster-fat-blink', 'sp-withered', 'sp-pearl', 'sp-gold', 'sea-crab-a', 'customer-wait', 'customer-happy',
  'hut-hut', 'bottle-0', 'bottle-1', 'bottle-2', 'bottle-3', 'win', 'farmer-front-idle', 'farmer-front-walk', 'farmer-back-idle', 'farmer-back-walk',
  'bld-stall', 'bld-shed', 'bld-lantern', 'bld-flag', 'bld-palm', 'bld-bench', 'bld-cat', 'pen-fishcage-empty', 'pen-fishcage-full', 'pen-crabpen-empty', 'pen-crabpen-full',
  'sea-fish1-a', 'sea-fish1-b', 'sea-fish2-a', 'sea-fish2-b', 'sea-fish3-a', 'sea-fish3-b', 'sea-gull-a', 'sea-gull-b', 'sea-jelly-a', 'sea-jelly-b', 'sc-cloud1', 'sc-cloud2', 'sc-cloud3',
].forEach(n => { const im = new Image(); im.src = `sprites/${n}.png`; IMG[n] = im; });
const cv = document.getElementById('c'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const hits = [];
const hit = (x, y, w, h, fn) => hits.push({ x, y, w, h, fn });
const ready = n => { const im = IMG[n]; return im && im.complete && im.naturalWidth ? im : null; };
function text(s, x, y, color = C.sand, size = 8, align = 'left') { g.font = `${size}px monospace`; g.textAlign = align; g.fillStyle = '#0c0c0e'; g.fillText(s, x + 1, y + 1); g.fillStyle = color; g.fillText(s, x, y); g.textAlign = 'left'; }
function ell(x, y, rx, ry, color) { g.fillStyle = color; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); }
function sprite(name, x, y, { flip = false, alpha = 1, scale = 1 } = {}) {
  const im = ready(name); if (!im) return false;
  g.save(); g.globalAlpha = alpha; g.translate(Math.round(x), Math.round(y)); if (flip) g.scale(-1, 1);
  g.drawImage(im, -Math.round(im.width * scale / 2), -Math.round(im.height * scale), im.width * scale, im.height * scale); g.restore(); return true;
}
const TINTS = {};
function tinted(name, tint) {
  const im = ready(name); if (!im) return null; if (!tint) return im;
  const k = name + '|' + tint; if (TINTS[k]) return TINTS[k];
  const oc = document.createElement('canvas'); oc.width = im.width; oc.height = im.height; const og = oc.getContext('2d');
  og.drawImage(im, 0, 0); og.globalCompositeOperation = 'source-atop'; og.globalAlpha = 0.4; og.fillStyle = tint; og.fillRect(0, 0, oc.width, oc.height);
  return TINTS[k] = oc;
}
function glow(x, y, r, color, a) { if (a <= 0) return; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, color); gr.addColorStop(1, 'transparent'); g.globalAlpha = a; g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); g.globalAlpha = 1; }
function float(s, x, y, color = C.gold2, size = 8, ui = false) { A.floaters.push({ s, x, y, life: 1.6, color, size, ui }); }
function pop(x, y, color, n = 8) { for (let i = 0; i < n; i++) A.particles.push({ x, y, vx: rnd(-30, 30), vy: rnd(-60, 0), life: 0.6, color }); }
function hop(im, x, y) { if (im) A.hops.push({ im, x, y, vy: -90, life: 0.9 }); } // a sprite that jumps up and fades (harvest, crate)
function collect(id, n = 1) { const first = !S.album[id]; S.album[id] = (S.album[id] || 0) + n; if (first) { const e = ALBUM.find(a => a.id === id); float(`New in album: ${e ? e.name : id}`, W / 2, 120, C.gold, 10, true); SFX.stamp(); } }
function rollRare(wx, wy) {
  for (const [id, r] of Object.entries(RARE)) if (Math.random() < r.odds) { S.cash += r.cash; collect(id); hop(ready(r.sprite), wx, wy); float(`${r.label}! +S$${r.cash}`, wx, wy - 40, C.gold, 10); return; }
}
function fmt(s) { s = Math.max(0, Math.ceil(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`; }

// ---- iso maths: world px of a tile centre; screen = world - cam + screen centre ----
function center(r, c) { return { x: (c - r) * TW / 2, y: (c + r) * TH / 2 + TH / 2 }; }
const scr = (wx, wy) => [wx - cam.x + W / 2, wy - cam.y + H / 2];
function tilePos(r, c) { const p = center(r, c); return scr(p.x, p.y); }
function tileAt(sx, sy) {
  const wx = sx - W / 2 + cam.x, wy = sy - H / 2 + cam.y, u = wx / (TW / 2), v = (wy - TH / 2) / (TH / 2);
  const c = Math.round((u + v) / 2), r = Math.round((v - u) / 2); const p = center(r, c);
  if (Math.abs(wx - p.x) / (TW / 2) + Math.abs(wy - p.y) / (TH / 2) > 1) return null; return { r, c };
}
function diamond(x, y, w = TW, h = TH) { g.beginPath(); g.moveTo(x, y - h / 2); g.lineTo(x + w / 2, y); g.lineTo(x, y + h / 2); g.lineTo(x - w / 2, y); g.closePath(); }
const species = id => SP.find(s => s.id === id);
const item = id => ITEMS.find(i => i.id === id);
const objAt = (r, c) => S.objs.find(o => o.r === r && o.c === c);
const has = id => S.objs.some(o => o.id === id);
const growth = p => (Date.now() - p.at) / 1000 / species(p.sp).time;
const withered = p => growth(p) >= 1 + 2 * (has('shed') ? 2 : 1);
const sellMul = () => has('stall') ? 1.1 : 1;

// ---- farmer: walks in a straight line to the task tile, then does it ----
// ponytail: no pathfinding; island + deck + raft are convex enough that straight lines rarely cross open sea. BFS if it bothers anyone.
function nearestWalkable(r, c) {
  if (walkable(r, c)) return [r, c]; let best = null, bd = 1e9;
  for (let i = 0; i < MAP; i++) for (let j = 0; j < MAP; j++) if (walkable(i, j) && !hutTile(i, j)) { const d = Math.abs(i - r) + Math.abs(j - c); if (d < bd) { bd = d; best = [i, j]; } }
  return best;
}
function go(r, c, fn) { const [tr, tc] = nearestWalkable(r, c); F.queue.push({ tr, tc, fn }); }
function stepFarmer(dt) {
  if (!F.queue.length) { F.moving = false; return; }
  const q = F.queue[0], dr = q.tr - F.r, dc = q.tc - F.c, d = Math.hypot(dr, dc);
  if (d < 0.05) { F.r = q.tr; F.c = q.tc; F.queue.shift(); q.fn(); save(); return; }
  const st = Math.min(d, WALK * dt); F.r += dr / d * st; F.c += dc / d * st; F.moving = true; F.walk += dt;
  const sx = dc - dr, sy = dc + dr; F.back = sy < 0; F.flip = sx < 0;
}

// ---- actions ----
function tapTile(r, c) {
  if (S.build) return place(r, c);
  if (r === BOAT.r && c === BOAT.c) return tapBoat();
  const o = objAt(r, c); if (o) return tapObj(o);
  if (raft(r, c)) {
    const pr = r - R0, pc = c - C0, p = S.plots[pr][pc], [x, y] = tilePos(r, c);
    if (!p) { S.pick = { r, c }; SFX.pop(); }
    else if (withered(p)) go(r, c, () => { S.plots[pr][pc] = null; pop(x, y, C.grey, 6); float('cleared', x, y - 20, C.grey); SFX.splash(); });
    else if (growth(p) >= 1) go(r, c, () => harvest(pr, pc));
    else { float(fmt(species(p.sp).time - (Date.now() - p.at) / 1000), x, y - 22, C.sand); SFX.chomp(); }
  } else if (raftZone(r, c) && r < R0 + S.n + 1 && c < C0 + S.n + 1 && S.n < MAXN) expand();
}
function plant(sp) {
  const { r, c } = S.pick, [x, y] = tilePos(r, c);
  if (S.level < sp.lvl) { SFX.nope(); return float(`level ${sp.lvl}`, x, y - 22, C.pink); }
  if (S.cash < sp.cost) { SFX.nope(); return float("Not enough $", x, y - 22, C.pink); }
  S.cash -= sp.cost; S.pick = null; SFX.pop();
  go(r, c, () => { S.plots[r - R0][c - C0] = { sp: sp.id, at: Date.now() }; pop(x, y, '#9ad0e0', 6); SFX.splash(); if (S.step === 0) S.step = 1; });
}
function harvest(pr, pc) {
  const p = S.plots[pr][pc]; if (!p || growth(p) < 1 || withered(p)) return;
  const sp = species(p.sp), [x, y] = tilePos(pr + R0, pc + C0), cash = Math.round(sp.sell * sellMul());
  const wp = center(pr + R0, pc + C0);
  S.plots[pr][pc] = null; S.cash += cash; pop(x, y - 8, C.gold2); hop(tinted('oyster-fat-idle', sp.tint), wp.x, wp.y); float(`+S$${cash}`, x, y - 24); float(`+${sp.xp}xp`, x, y - 14, '#9ad0e0', 7); SFX.coin();
  S.stats.harvest[sp.id] = (S.stats.harvest[sp.id] || 0) + 1; collect(sp.id); rollRare(wp.x, wp.y); if (S.step === 1) S.step = 2; gainXp(sp.xp); checkQuests();
}
function gainXp(n) {
  S.xp += n;
  for (let i = 0; S.xp >= lvlXp(S.level + 1); i++) {
    S.level++; const u = [...SP.filter(s => s.lvl === S.level), ...ITEMS.filter(s => s.lvl === S.level)].map(s => s.name);
    float(`Level ${S.level}!` + (u.length ? `  ${u.join(', ')} unlocked` : ''), W / 2, 60 + i * 14, C.gold, 11, true); SFX.stamp();
  }
}
function expand() {
  const [cost, lvl] = EXPAND[S.n + 1], [x, y] = tilePos(R0 + S.n, C0 + S.n);
  if (S.level < lvl) { SFX.nope(); return float(`level ${lvl} to expand`, x, y, C.pink); }
  if (S.cash < cost) { SFX.nope(); return float("Not enough $", x, y, C.pink); }
  S.cash -= cost; S.n++; float('raft expanded!', x, y, C.gold, 10); SFX.stamp(); pop(x, y, '#9ad0e0', 10);
}
function canPlace(it, r, c) {
  if (!inMap(r, c) || objAt(r, c) || hutTile(r, c) || deck(r, c) || (r === BOAT.r && c === BOAT.c)) return false;
  return it.on === 'land' ? land(r, c) : !land(r, c) && !raftZone(r, c);
}
function place(r, c) {
  const it = item(S.build), [x, y] = tilePos(r, c);
  if (!canPlace(it, r, c)) { SFX.nope(); return float(it.on === 'land' ? 'needs land' : 'needs open sea', x, y - 10, C.pink); }
  if (S.cash < it.cost) { SFX.nope(); return float("Not enough $", x, y - 10, C.pink); }
  S.cash -= it.cost; S.objs.push({ id: it.id, r, c, fed: null }); S.build = null; S.stats.built++;
  pop(x, y, C.gold2, 10); float(`+${it.xp}xp`, x, y - 20, '#9ad0e0'); SFX.stamp(); gainXp(it.xp); checkQuests();
}
function tapObj(o) {
  const it = item(o.id), [x, y] = tilePos(o.r, o.c); if (!it.pen) { SFX.chomp(); return float(it.name, x, y - 30, C.sand); }
  const pen = it.pen, left = o.fed ? pen.time - (Date.now() - o.fed) / 1000 : 0;
  if (!o.fed) {
    if (S.cash < pen.feed) { SFX.nope(); return float("Not enough $", x, y - 30, C.pink); }
    S.cash -= pen.feed; SFX.pop(); go(o.r, o.c, () => { o.fed = Date.now(); pop(x, y - 10, '#9ad0e0', 6); float(pen.win ? 'bottle lowered' : 'fed', x, y - 30, C.sand); SFX.splash(); });
  } else if (left > 0) { float(fmt(left), x, y - 30, C.sand); SFX.chomp(); }
  else go(o.r, o.c, () => {
    o.fed = null; const cash = Math.round(pen.sell * sellMul()); S.cash += cash; S.stats.collect++;
    if (pen.win) { S.won = true; S.bottles++; } else { float(`+S$${cash}`, x, y - 34); } collect(pen.what);
    float(`+${pen.xp}xp`, x, y - 24, '#9ad0e0', 7); pop(x, y - 10, C.gold2); SFX.coin(); gainXp(pen.xp); checkQuests();
  });
}

// ---- sampan: an idle trip; send it out, come back later for a crate ----
const boatLeft = () => S.boat.out ? BOAT.trips[S.boat.trip].h * 3600 - (Date.now() - S.boat.out) / 1000 : 0;
function tapBoat() {
  const [x, y] = tilePos(BOAT.r, BOAT.c), b = S.boat;
  if (!b.out) { S.panel = S.panel === 'boat' ? null : 'boat'; SFX.pop(); return; }
  if (boatLeft() > 0) { float(`back in ${fmt(boatLeft())}`, x, y - 30, C.sand); SFX.chomp(); return; }
  const tr = BOAT.trips[b.trip]; b.out = null; const cash = Math.round(tr.cash * sellMul() * rnd(0.8, 1.3)), wp = center(BOAT.r, BOAT.c);
  go(BOAT.r, BOAT.c, () => { S.cash += cash; float(`crate! +S$${cash}`, x, y - 36, C.gold, 10); float(`+${tr.xp}xp`, x, y - 26, '#9ad0e0', 7); pop(x, y - 10, C.gold2, 12); hop(ready('sea-fish2-a'), wp.x, wp.y); SFX.coin(); collect('fish', 1 + tr.h); if (Math.random() < 0.3) rollRare(wp.x, wp.y - 10); gainXp(tr.xp); });
}
function sendBoat(i) {
  const tr = BOAT.trips[i], [x, y] = tilePos(BOAT.r, BOAT.c);
  if (S.cash < tr.cost) { SFX.nope(); return float("Not enough $", x, y - 30, C.pink); }
  S.cash -= tr.cost; S.boat = { out: Date.now(), trip: i }; S.panel = null; float(`sampan out for ${tr.h}h`, x, y - 30, C.sand); SFX.splash(); pop(x, y, '#9ad0e0', 8);
}

// ---- quests: three a day, drawn from what the player can actually do ----
function newQuest() {
  const sps = SP.filter(s => s.lvl <= S.level), pens = S.objs.filter(o => item(o.id).pen && !item(o.id).pen.win);
  const kinds = ['harvest', 'harvest', ...(pens.length ? ['collect'] : []), ...(S.level >= 2 ? ['build'] : [])];
  const k = kinds[Math.floor(Math.random() * kinds.length)];
  if (k === 'harvest') { const sp = sps[Math.floor(Math.random() * sps.length)], n = 4 + Math.floor(Math.random() * 6); return { k, sp: sp.id, n, base: S.stats.harvest[sp.id] || 0, cash: Math.round(sp.sell * n * 0.6), xp: sp.xp * n, text: `Harvest ${n} ${sp.name}` }; }
  if (k === 'collect') { const n = 1 + Math.floor(Math.random() * 3); return { k, n, base: S.stats.collect, cash: 80 * n, xp: 20 * n, text: `Collect from pens ×${n}` }; }
  return { k, n: 1, base: S.stats.built, cash: 100, xp: 30, text: 'Build anything' };
}

function closePanels() { S.panel = null; S.pick = null; S.build = null; }
function panelBox(x, y, w, h) { if (!S.build) hit(0, 18, W, H - 18, closePanels); g.fillStyle = '#0c0c0ee6'; g.fillRect(x, y, w, h); g.strokeStyle = C.deep; g.lineWidth = 1; g.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1); hit(x, y, w, h, () => {}); text('×', x + w - 7, y + 9, C.grey, 9, 'center'); hit(x + w - 14, y, 14, 14, closePanels); }
function drawPicker() {
  const w = 64, x0 = W / 2 - SP.length * w / 2, y0 = 22; panelBox(x0 - 6, y0, SP.length * w + 12, 58);
  SP.forEach((sp, i) => {
    const x = x0 + i * w + w / 2, locked = S.level < sp.lvl, poor = S.cash < sp.cost, im = tinted('oyster-fat-idle', sp.tint);
    g.globalAlpha = locked ? 0.3 : 1; if (im) g.drawImage(im, Math.round(x - im.width / 2), y0 + 5);
    text(sp.name, x, y0 + 42, locked ? C.grey : C.sand, 7, 'center'); text(locked ? `lv ${sp.lvl}` : `S$${sp.cost} · ${fmt(sp.time)}`, x, y0 + 52, locked ? C.grey : poor ? C.pink : C.gold2, 6, 'center'); g.globalAlpha = 1;
    hit(x - w / 2, y0, w, 58, () => plant(sp));
  });
}
function drawBuild() {
  const w = 62, x0 = W / 2 - ITEMS.length * w / 2, y0 = H - 76; panelBox(x0 - 6, y0, ITEMS.length * w + 12, 70);
  ITEMS.forEach((it, i) => {
    const x = x0 + i * w + w / 2, locked = S.level < it.lvl, sel = S.build === it.id;
    if (sel) { g.fillStyle = '#c9a96e33'; g.fillRect(x - w / 2, y0, w, 70); }
    g.globalAlpha = locked ? 0.3 : 1; const nm = it.pen && !it.pen.win ? `${it.sprite}-full` : it.id === 'cellar' ? 'bottle-3' : it.sprite, im = ready(nm);
    if (im) { const s = Math.min(1, 36 / im.height, 50 / im.width); g.drawImage(im, Math.round(x - im.width * s / 2), Math.round(y0 + 42 - im.height * s), Math.round(im.width * s), Math.round(im.height * s)); }
    text(it.name, x, y0 + 54, locked ? C.grey : C.sand, 6, 'center'); text(locked ? `lv ${it.lvl}` : `S$${it.cost}`, x, y0 + 64, locked ? C.grey : S.cash < it.cost ? C.pink : C.gold2, 6, 'center'); g.globalAlpha = 1;
    hit(x - w / 2, y0, w, 70, () => { if (locked) { SFX.nope(); return float(`level ${it.lvl}`, x, y0 - 6, C.pink, 8, true); } S.build = sel ? null : it.id; SFX.pop(); });
  });
  text(S.build ? `${item(S.build).name}${item(S.build).note ? ' · ' + item(S.build).note : ''} — tap a ${item(S.build).on === 'land' ? 'land' : 'sea'} tile` : 'pick something to build', W / 2, y0 - 6, C.sand, 7, 'center');
}
function drawAlbum() {
  const w = 54, cols = 5, x0 = W - 6 - cols * w, y0 = 22; panelBox(x0 - 6, y0, cols * w + 12, 130);
  const found = ALBUM.filter(a => S.album[a.id]).length; text(`Album  ${found}/${ALBUM.length}`, x0, y0 + 12, C.gold2, 8);
  ALBUM.forEach((a, i) => {
    const x = x0 + (i % cols) * w + w / 2, y = y0 + 18 + Math.floor(i / cols) * 56, n = S.album[a.id] || 0, im = a.icon();
    if (im) { const s = Math.min(1, 28 / im.height, 40 / im.width); g.globalAlpha = n ? 1 : 0.12; g.drawImage(im, Math.round(x - im.width * s / 2), Math.round(y + 30 - im.height * s), Math.round(im.width * s), Math.round(im.height * s)); g.globalAlpha = 1; }
    if (!n) text('?', x, y + 22, C.grey, 12, 'center');
    text(n ? a.name : '???', x, y + 40, n ? (a.rare ? C.gold : C.sand) : C.grey, 6, 'center'); if (n) text(`×${n}`, x, y + 48, C.gold2, 6, 'center');
  });
}
function drawBoatPanel() {
  const w = 150, x0 = W / 2 - w, y0 = H / 2 - 40; panelBox(x0 - 6, y0, w * 2 + 12, 80); text('Send the sampan out', W / 2, y0 + 14, C.gold2, 8, 'center');
  BOAT.trips.forEach((tr, i) => {
    const x = x0 + i * w + w / 2; g.fillStyle = '#1a2a40'; g.fillRect(x - w / 2 + 6, y0 + 22, w - 12, 50);
    text(`${tr.h} hour trip`, x, y0 + 38, C.sand, 8, 'center'); text(`costs S$${tr.cost}`, x, y0 + 50, S.cash < tr.cost ? C.pink : C.gold2, 7, 'center'); text(`crate ≈ S$${tr.cash} · +${tr.xp}xp`, x, y0 + 62, C.grey, 6, 'center');
    hit(x - w / 2 + 6, y0 + 22, w - 12, 50, () => sendBoat(i));
  });
}
function drawQuests() {
  panelBox(W - 230, 22, 220, 70); text('Today\'s quests', W - 220, 36, C.gold2, 8);
  S.quests.forEach((q, i) => { const y = 50 + i * 14, p = questProg(q); text(q.text, W - 220, y, C.sand, 7); text(`${p}/${q.n}`, W - 80, y, p >= q.n ? C.gold : C.grey, 7, 'right'); text(`S$${q.cash} +${q.xp}xp`, W - 18, y, C.gold2, 6, 'right'); });
}
function draw() {
  hits.length = 0; const t = S.t, D = sky();
  g.fillStyle = D.sea; g.fillRect(0, 0, W, H);
  drawWorld(t, D);
  // time of day tint, then sky-layer life (gulls, clouds) in screen space
  g.fillStyle = D.tint; g.globalAlpha = D.ta; g.fillRect(0, 0, W, H); g.globalAlpha = 1;
  for (const c of A.clouds) sprite(`sc-${c.k}`, c.x, c.y, { alpha: 0.5, scale: 1.5 });
  for (const b of A.gulls) sprite(Math.floor(t * 6 + b.ph) % 2 ? 'sea-gull-a' : 'sea-gull-b', b.x, b.y + Math.sin(t * 2 + b.ph) * 3, { flip: b.v < 0 });
  const v = g.createRadialGradient(W / 2, H / 2, 220, W / 2, H / 2, 440); v.addColorStop(0, 'transparent'); v.addColorStop(1, '#00000044'); g.fillStyle = v; g.fillRect(0, 0, W, H);
  // panels and hud
  if (S.pick) drawPicker();
  if (S.panel === 'build') drawBuild();
  if (S.panel === 'quests') drawQuests();
  if (S.panel === 'album') drawAlbum();
  if (S.panel === 'boat') drawBoatPanel();
  for (const f of A.floaters) if (f.ui) { g.globalAlpha = Math.min(1, f.life); text(f.s, f.x, f.y, f.color, f.size, 'center'); } g.globalAlpha = 1;
  g.fillStyle = '#0c0c0eb0'; g.fillRect(0, 0, W, 18);
  text(`S$${S.cash}`, 8, 13, C.gold2, 11);
  const a = lvlXp(S.level), b = lvlXp(S.level + 1), k = (S.xp - a) / (b - a);
  text(`Lv ${S.level}`, 150, 13, C.sand, 9, 'right'); g.fillStyle = '#2b3a50'; g.fillRect(156, 6, 80, 6); g.fillStyle = '#9ad0e0'; g.fillRect(156, 6, Math.round(80 * k), 6); text(`${S.xp}/${b}`, 242, 13, C.grey, 7);
  text(`${S.n}×${S.n} raft`, 300, 13, C.sand, 8, 'center'); if (S.bottles) text(`🍾 ${S.bottles}`, 350, 13, C.gold2, 8, 'center');
  const btn = (x, label, on, fn) => { g.fillStyle = on ? C.gold2 : '#2b3a50'; g.fillRect(x, 3, 54, 12); text(label, x + 27, 12, on ? C.ink : C.sand, 7, 'center'); hit(x, 0, 54, 18, fn); };
  btn(410, 'album', S.panel === 'album', () => { S.panel = S.panel === 'album' ? null : 'album'; S.build = null; SFX.pop(); });
  btn(470, 'quests', S.panel === 'quests', () => { S.panel = S.panel === 'quests' ? null : 'quests'; S.build = null; SFX.pop(); });
  btn(530, 'build', S.panel === 'build', () => { S.panel = S.panel === 'build' ? null : 'build'; S.build = null; S.pick = null; SFX.pop(); });
  text(muted ? '♪̸' : '♪', 620, 13, muted ? '#777' : C.gold2, 11, 'center'); hit(606, 0, 30, 18, toggleMute);
  if (S.won) {
    if (ready('win')) g.drawImage(IMG.win, 0, 0, W, H); else { g.fillStyle = '#0c0c0ed0'; g.fillRect(0, 0, W, H); }
    text('Six months beneath the waves.', W / 2, 44, C.gold2, 18, 'center'); text('Your NILA bottle is ready.', W / 2, 66, C.sand, 11, 'center');
    g.fillStyle = C.ink + 'cc'; g.fillRect(20, 320, 140, 24); text('Reserve a bottle', 90, 336, C.gold, 10, 'center'); hit(20, 320, 140, 24, () => window.open(NILA_LINK, '_blank'));
    g.fillRect(480, 320, 140, 24); text('Keep farming', 550, 336, C.sand, 10, 'center'); hit(480, 320, 140, 24, () => { S.won = false; });
  }
}

// ---- input: drag pans the camera, a short press taps ----
let press = null;
const toCanvas = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); const [x, y] = toCanvas(e); press = { x, y, cx: cam.x, cy: cam.y, drag: false }; audio(); });
cv.addEventListener('pointermove', e => {
  if (!press) return; const [x, y] = toCanvas(e), dx = x - press.x, dy = y - press.y;
  if (!press.drag && Math.hypot(dx, dy) > 6) press.drag = true;
  if (press.drag) { cam.x = Math.max(-(MAP - 2) * TW / 2, Math.min((MAP - 2) * TW / 2, press.cx - dx)); cam.y = Math.max(TH * 2, Math.min((MAP - 1) * TH, press.cy - dy)); }
});
cv.addEventListener('pointerup', e => {
  if (!press) return; const was = press; press = null; if (was.drag) { save(); return; }
  const x = was.x, y = was.y, h = [...hits].reverse().find(h => x >= h.x && x < h.x + h.w && y >= h.y && y < h.y + h.h);
  if (h) { h.fn(); save(); return; }
  if (S.won) return;
  if (S.pick) { S.pick = null; return; }
  const tl = tileAt(x, y);
  if (tl && inMap(tl.r, tl.c)) { tapTile(tl.r, tl.c); save(); return; }
  const wx = x - W / 2 + cam.x, wy = y - H / 2 + cam.y; A.ripples.push({ x: wx, y: wy, r: 2, life: 1 }); SFX.splash();
});
refreshQuests();
{ let n = 0; for (const row of S.plots) for (const p of row) if (p && growth(p) >= 1 && !withered(p)) n++; const w = S.plots.flat().filter(p => p && withered(p)).length; if (n || w) setTimeout(() => float(`${n ? `${n} ready` : ''}${n && w ? ', ' : ''}${w ? `${w} withered` : ''} while you were away`, W / 2, 100, C.gold, 10, true), 600); }
let last = performance.now();
(function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(loop); })(last);
</script>
