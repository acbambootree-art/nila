<html lang="en">

<title>Indigo Tides</title>
<style>
  html, body { margin: 0; background: #0c0c0e; }
  #wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
  canvas { width: 100%; image-rendering: pixelated; display: block; touch-action: none; border-radius: 6px; box-shadow: 0 20px 60px #000a; }

<body>
<div id="wrap"><canvas id="c" width="640" height="360"></canvas></div>
<script>
// ---- tuning ----
const SP = [ // oyster species: grow seconds, spat price, sale, xp, unlock level, tint
  { id: 'rock',     name: 'Rock',     time: 60,        cost: 5,   sell: 12,   xp: 3,   lvl: 1, tint: null },
  { id: 'pacific',  name: 'Pacific',  time: 5 * 60,    cost: 15,  sell: 45,   xp: 8,   lvl: 2, tint: '#7fb8d8' },
  { id: 'kumamoto', name: 'Kumamoto', time: 30 * 60,   cost: 40,  sell: 170,  xp: 25,  lvl: 4, tint: '#a8d8a0' },
  { id: 'pearl',    name: 'Pearl',    time: 4 * 3600,  cost: 150, sell: 900,  xp: 120, lvl: 6, tint: '#f1c4cf' },
  { id: 'belon',    name: 'Belon',    time: 12 * 3600, cost: 500, sell: 3500, xp: 400, lvl: 8, tint: '#c9a96e' },
];
const FISH = [ // what Singapore kelongs rear and wet markets sell; tap an empty fish cage to pick one
  { id: 'seabass', name: 'Seabass',    time: 20 * 60,   cost: 20,  sell: 90,   xp: 15,  lvl: 2 },
  { id: 'pomfret', name: 'Pomfret',    time: 3600,      cost: 50,  sell: 240,  xp: 35,  lvl: 3 },
  { id: 'snapper', name: 'Snapper',    time: 3 * 3600,  cost: 120, sell: 600,  xp: 90,  lvl: 4 },
  { id: 'grouper', name: 'Grouper',    time: 8 * 3600,  cost: 300, sell: 1600, xp: 250, lvl: 6 },
];
const fishOf = id => FISH.find(f => f.id === id);
const ITEMS = [ // buildable: on land or sea; pens have a feed→wait→collect cycle; effects are read where they apply
  { id: 'lantern',  name: 'Lantern',     cost: 60,   xp: 5,   lvl: 1, on: 'land', sprite: 'bld-lantern', note: 'wither -25%', desc: 'A ready oyster withers if left too long. A lantern gives you 25% more time to harvest it.' },
  { id: 'fishcage', name: 'Fish cage',   cost: 150,  xp: 10,  lvl: 2, on: 'pen',  sprite: 'pen-fishcage', pen: { feed: 20, time: 20 * 60, sell: 90, xp: 15, what: 'fish' }, note: 'rear 4 fish', desc: 'Pick what to rear: seabass, pomfret, snapper or grouper. Stock it, wait, collect the catch. Goes in an empty pen.' },
  { id: 'bench',    name: 'Bench',       cost: 80,   xp: 6,   lvl: 2, on: 'land', sprite: 'bld-bench', note: '+1 quest/day', desc: 'A fourth quest every day, so more coins and XP from the quest board.' },
  { id: 'palm',     name: 'Palm',        cost: 120,  xp: 10,  lvl: 2, on: 'land', sprite: 'bld-palm', note: '+5% sales ×3', desc: 'Each palm adds 5% to every sale. Up to three palms count.' },
  { id: 'crabpen',  name: 'Crab pen',    cost: 250,  xp: 15,  lvl: 3, on: 'pen',  sprite: 'pen-crabpen', pen: { feed: 40, time: 3600, sell: 220, xp: 35, what: 'crabs' }, note: 'crabs every 1h', desc: 'Feed it S$40, wait an hour, collect S$220 of crabs. Goes in an empty pen.' },
  { id: 'stall',    name: 'Market',      cost: 500,  xp: 40,  lvl: 3, on: 'land', sprite: 'bld-stall', note: '+10% sales', desc: 'Every oyster, fish and crab sale pays 10% more.' },
  { id: 'flag',     name: 'Flag',        cost: 200,  xp: 15,  lvl: 3, on: 'land', sprite: 'bld-flag', note: 'boat -20%', desc: 'Bumboat trips come back 20% sooner.' },
  { id: 'cat',      name: 'Cat',         cost: 300,  xp: 25,  lvl: 4, on: 'land', sprite: 'bld-cat', note: '2× rare finds', desc: 'Pearl and gold shell finds on harvest are twice as likely.' },
  { id: 'dog',      name: 'Dog',         cost: 350,  xp: 25,  lvl: 3, on: 'land', sprite: 'dog-sit', note: 'crew +20% speed', desc: 'A golden retriever who runs about the farm and keeps the crew cheerful: workers walk 20% faster. Place his bed on the platform.' },
  { id: 'shed',     name: 'Ice store',        cost: 800,  xp: 60,  lvl: 5, on: 'land', sprite: 'bld-shed', note: 'wither 2× slow', desc: 'Doubles the time a ready oyster waits before it withers.' },
  { id: 'cellar',   name: 'NILA cellar', cost: 400,  xp: 50,  lvl: 5, on: 'pen',  sprite: 'cellar', pen: { feed: 100, time: 6 * 3600, sell: 0, xp: 300, what: 'bottle', win: true }, note: 'age a bottle', desc: 'Lower a NILA bottle for S$100. Six real hours later it comes up sea-aged: the win.' },
];
const FIX = 20, BREAK_MS = 30 * 60 * 1000, MAX_BROKEN = 4; // a plank breaks every 30 real minutes, up to 4 holes
const WORKERS = [ // hired at the hut; one-off cost, they work forever
  { id: 'harvester', name: 'Harvester',  cost: 400, lvl: 3, note: 'harvests & clears', desc: 'Harvests ready oysters into the tank, clears withered ones, sells the clean ones.' },
  { id: 'keeper',    name: 'Pen keeper', cost: 700, lvl: 4, note: 'feeds & collects pens', desc: 'Feeds empty fish cages and crab pens (feed comes from your coins) and collects them when ready.' },
  { id: 'carpenter', name: 'Carpenter',  cost: 600, lvl: 4, note: 'fixes broken planks', desc: 'Fixes broken planks on his own, S$20 each from your coins.' },
];
const FR0 = 1, FC0 = 6, MAXA = 4, MAXB = 3; // the fish farm: walkway lanes every 3rd row and column, 2×2 net pens between, east of the shed platform
const EXPAND = [[150, 2], [500, 3], [1500, 5], [4000, 7]]; // cost and level of each added pen row or pen column, in order
const UPGRADES = [ // shed upgrades, bought once each from the shed panel
  { id: 'drums',     name: 'More drums',  cost: 400,  lvl: 2, desc: 'Extra floats under the planks. Planks break half as often.' },
  { id: 'bigshed',   name: 'Bigger shed', cost: 600,  lvl: 3, desc: 'Room for a crew: hire all three workers (one without it).' },
  { id: 'generator', name: 'Generator',   cost: 1200, lvl: 5, desc: 'Lights along the walkways at night. Everything grows 10% faster.' },
  { id: 'jetty',     name: 'Ubin jetty',  cost: 2500, lvl: 6, desc: 'A pier for the bumboat. Unlocks the 4 h market run to Pulau Ubin.' },
];
const up = id => !!(S.up && S.up[id]);
const ALBUM = [ // collection book entries; counts live in S.album
  ...SP.map(s => ({ id: s.id, name: s.name, icon: () => tinted('oyster-fat-idle', s.tint) })),
  ...FISH.map(f => ({ id: f.id, name: f.name, icon: () => ready(`fish-${f.id}`) })), { id: 'crabs', name: 'Crabs', icon: () => ready('sea-crab-a') }, { id: 'bottle', name: 'NILA', icon: () => ready('bottle-3') },
  { id: 'rarepearl', name: 'Pearl drop', icon: () => ready('sp-pearl'), rare: true }, { id: 'gold', name: 'Gold shell', icon: () => ready('sp-gold'), rare: true },
];
const RARE = { rarepearl: { odds: 0.05, cash: 60, sprite: 'sp-pearl', label: 'pearl' }, gold: { odds: 0.01, cash: 400, sprite: 'sp-gold', label: 'GOLD' } }; // per harvest
const BOAT = { r: 7, c: 2, trips: [{ h: 2, cost: 30, cash: 150, xp: 20, name: 'Fishing run' }, { h: 8, cost: 100, cash: 800, xp: 90, name: 'Overnight run' }, { h: 4, cost: 200, cash: 1600, xp: 150, name: 'Ubin market', jetty: true }] };
const NILA_LINK = 'https://nila.wine';
const W = 640, H = 360, TW = 64, TH = 32, MAP = 16, daySeconds = 300, WALK = 2.6;
const lvlXp = L => L <= 1 ? 0 : Math.round(30 * Math.pow(L - 1, 1.7));
const C = { sand: '#f5f0e8', gold: '#c9a96e', gold2: '#d4bc8a', deep: '#a8884f', ink: '#0c0c0e', pink: '#f1c4cf', green: '#5f9a6a', wood: '#6b4f3a', wood2: '#8a6a4a', grey: '#8a9ab0' };
const rnd = (a, b) => a + Math.random() * (b - a);
// how each job looks while the actor stands and works: duration, beat between bursts, particles, sound, held tool
const WORK = {
  feed:    { t: 0.9, beat: 0.3,  n: 4, y: 14, col: ['#a8884f', '#8a6a3a'], sfx: () => SFX.chomp(), tool: 'bucket', anim: ['feed-a', 'feed-b'] },
  collect: { t: 0.9, beat: 0.3,  n: 3, y: 18, col: ['#f6d48a', '#ffffff'], sfx: () => SFX.pop(),   tool: 'basket', anim: ['harvest-a', 'harvest-b'] },
  fix:     { t: 1.4, beat: 0.35, n: 5, y: 4,  col: ['#d9b48a', '#c0c0c0', '#8a5a3a'], sfx: () => SFX.tok(), tool: 'hammer', anim: ['hammer-a', 'hammer-b'] },
  plant:   { t: 0.6, beat: 0.3,  n: 4, y: 2,  col: ['#9ad0e0', '#e8f4ff'], sfx: () => SFX.splash(), tool: 'oyster', anim: ['plant'] },
  harvest: { t: 0.7, beat: 0.35, n: 4, y: 2,  col: ['#9ad0e0', '#e8f4ff'], sfx: () => SFX.splash(), tool: 'basket', anim: ['harvest-a', 'harvest-b'] },
  sweep:   { t: 1.6, beat: 0.4,  n: 2, y: 2,  col: ['#d9b48a'], sfx: () => {}, tool: 'broom', anim: ['sweep'] },
  // off-duty: these are what a character does when nothing needs doing. 'pose' sprites are per character (<pre>-idle-<pose>)
  fish:    { t: 12, beat: 99, n: 0, y: 0, col: [], sfx: () => {}, tool: null, pose: 'fish' },
  rest:    { t: 10, beat: 99, n: 0, y: 0, col: [], sfx: () => {}, tool: null, pose: 'rest' },
  swim:    { t: 18, beat: 99, n: 0, y: 0, col: [], sfx: () => {}, tool: null, pose: 'swim' },
  mend:    { t: 8,  beat: 99, n: 0, y: 0, col: [], sfx: () => {}, tool: null, pose: 'mend' },
};

// ---- map, after the real farm off Pulau Ubin: a floating shed platform (west), a grid of walkways with net pens between (east) ----
const land = (r, c) => r >= 1 && c >= 1 && r <= 6 && c <= 5;
const deck = (r, c) => up('jetty') && c === 1 && (r === 7 || r === 8); // the Ubin jetty, once built
const farm = (r, c) => r >= FR0 && c >= FC0 && r <= FR0 + 3 * S.farm.a && c <= FC0 + 3 * S.farm.b;
const lane = (r, c) => farm(r, c) && ((r - FR0) % 3 === 0 || (c - FC0) % 3 === 0);
const penTile = (r, c) => farm(r, c) && !lane(r, c);
const penOf = (r, c) => penTile(r, c) ? { r0: FR0 + 3 * Math.floor((r - FR0) / 3) + 1, c0: FC0 + 3 * Math.floor((c - FC0) / 3) + 1 } : null;
const farmZone = (r, c) => r >= FR0 && c >= FC0 && r <= FR0 + 3 * MAXA && c <= FC0 + 3 * MAXB;
// which way a tap on open sea would grow the farm: 'a' adds a pen row below, 'b' a pen column to the right
const expandDir = (r, c) => { const A = FR0 + 3 * S.farm.a, B = FC0 + 3 * S.farm.b;
  if (S.farm.a < MAXA && r > A && r <= A + 3 && c >= FC0 && c <= B) return 'a';
  if (S.farm.b < MAXB && c > B && c <= B + 3 && r >= FR0 && r <= A) return 'b'; return null; };
const HUT = { r: 2, c: 2 }; // 2×2 footprint ending at this tile
const TANK = { r: 4, c: 4 }; // the depuration tank on the shed platform
const hutTile = (r, c) => (r >= 1 && r <= 2 && c >= 1 && c <= 2) || (r === TANK.r && c === TANK.c); // tiles nobody walks or builds on
// depuration: harvested oysters sit in UV-cleaned seawater to purge before they may be sold (real tanks: 24–48 h; here 3 min)
const DEP = 180, TANK_LV = [{ cap: 6 }, { cap: 16, cost: 300, lvl: 2 }, { cap: 40, cost: 1200, lvl: 4 }];
const tankCap = () => TANK_LV[S.tankLv].cap, tankFull = () => S.tank.length >= tankCap();
const isClean = o => (Date.now() - o.at) / 1000 >= DEP / (up('generator') ? 1.1 : 1);
const isBroken = (r, c) => S.broken.some(([i, j]) => i === r && j === c);
const walkable = (r, c) => ((land(r, c) || lane(r, c)) && !isBroken(r, c)) || deck(r, c);
const inMap = (r, c) => r >= 0 && c >= 0 && r < MAP && c < MAP;

const S = load() || {
  cash: 40, xp: 0, level: 1, farm: { a: 1, b: 2 }, up: {}, plots: Array.from({ length: MAP }, () => Array(MAP).fill(null)),
  objs: [], bottles: 0, won: false, step: 0, quests: [], questDay: '', stats: { harvest: {}, collect: 0, built: 0 },
  farmer: { r: 3, c: 4 }, cam: null, album: {}, boat: { out: null, trip: 0 }, broken: [], lastBreak: Date.now(),
};
S.broken = S.broken || []; S.lastBreak = S.lastBreak || Date.now();
S.album = S.album || {}; S.boat = S.boat || { out: null, trip: 0 }; S.up = S.up || {}; S.tank = S.tank || []; S.tankLv = S.tankLv || 0;
S.objs = (S.objs || []).filter(o => !(o.r === TANK.r && o.c === TANK.c)); S.broken = (S.broken || []).filter(([r, c]) => !(r === TANK.r && c === TANK.c));
if (!S.farm) { // a save from the stilt-and-raft version: size the farm from the old raft, refund what no longer has a place
  const n = S.n || 3; S.farm = { a: [1, 2, 3, 3, 4][n - 3] || 1, b: [2, 2, 2, 3, 3][n - 3] || 2 }; delete S.n;
  for (const row of S.plots || []) for (const p of row) if (p) S.cash += SP.find(s => s.id === p.sp).cost;
  S.plots = Array.from({ length: MAP }, () => Array(MAP).fill(null));
  S.objs = (S.objs || []).filter(o => { const it = ITEMS.find(i => i.id === o.id); if (it.on === 'land' && land(o.r, o.c) && !hutTile(o.r, o.c)) return true; S.cash += it.cost; return false; });
  S.broken = []; S.farmer = { r: 3, c: 4 }; for (const w of S.workers || []) { w.r = 3; w.c = 3; }
}
const actor = w => Object.assign({ queue: [], walk: 0, back: false, flip: false, moving: false, think: 0 }, w);
const WK = (S.workers || []).map(actor); S.workers = WK;
Object.assign(S, { t: daySeconds * 0.75, pick: null, pickFish: null, build: null, panel: null });
const F = Object.assign({ tr: null, tc: null, queue: [], walk: 0, back: false, flip: false, moving: false }, S.farmer); S.farmer = F;
const cam = S.cam || { x: 90, y: 140 }; S.cam = cam;
const A = { fish: [], jelly: [], bubbles: [], ripples: [], floaters: [], particles: [], gulls: [], clouds: [], hops: [] };
for (let i = 0; i < 8; i++) A.fish.push({ kind: 1 + (i % 3), x: rnd(-500, 500), y: rnd(0, 500), v: rnd(8, 18) * (Math.random() < 0.5 ? 1 : -1), ph: rnd(0, 6) });
for (let i = 0; i < 3; i++) A.jelly.push({ x: rnd(-400, 400), y: rnd(100, 450), ph: rnd(0, 6) });
for (let i = 0; i < 1; i++) A.gulls.push({ x: rnd(0, W), y: rnd(30, 70), v: 12, ph: rnd(0, 6) });
[['cloud1', 40, 40, 3], ['cloud2', 300, 70, 2], ['cloud3', 520, 30, 4]].forEach(([k, x, y, v]) => A.clouds.push({ k, x, y, v }));

function load() { try { return JSON.parse(localStorage.getItem('indigo-farm-v2')); } catch { return null; } }
function save() { try { const { t, pick, pickFish, build, panel, ...rest } = S; rest.farmer = { r: F.r, c: F.c }; rest.workers = WK.map(w => ({ id: w.id, r: w.r, c: w.c })); localStorage.setItem('indigo-farm-v2', JSON.stringify(rest)); } catch {} }

// ---- sprites ----
const IMG = {};
['oyster-baby-idle', 'oyster-baby-blink', 'oyster-medium-idle', 'oyster-medium-blink', 'oyster-fat-idle', 'oyster-fat-blink', 'sp-withered', 'sp-pearl', 'sp-gold', 'sea-crab-a', 'customer-wait', 'customer-happy',
  'hut-hut', 'dog-run-a', 'dog-run-b', 'dog-sit', 'dog-lie', 'dog-sniff', 'dog-bed', 'tank-0', 'tank-1', 'tank-2', 'shed-small', 'shed-big', 'shed-gen', 'shed-drum', 'shed-crates', 'boat-bumboat', 'bg-ubin', 'bottle-0', 'bottle-1', 'bottle-2', 'bottle-3', 'win', 'farmer-front-idle', 'farmer-front-walk', 'farmer-back-idle', 'farmer-back-walk', 'farmer-work-hammer-a', 'farmer-work-hammer-b', 'farmer-work-feed-a', 'farmer-work-feed-b', 'farmer-work-harvest-a', 'farmer-work-harvest-b', 'farmer-work-plant', 'farmer-work-sweep',
  ...['carpenter', 'keeper', 'harvester'].flatMap(w => ['front-idle', 'front-walk', 'back-idle', 'back-walk', 'work-a', 'work-b', 'idle-fish', 'idle-rest', 'idle-mend', 'swim-a', 'swim-b', 'swim-play', 'swim-float'].map(f => `wk-${w}-${f}`)), 'farmer-idle-fish', 'farmer-idle-rest', 'farmer-idle-mend', 'farmer-swim-a', 'farmer-swim-b', 'farmer-swim-play', 'farmer-swim-float',
  'bld-stall', 'bld-shed', 'bld-lantern', 'bld-flag', 'bld-palm', 'bld-bench', 'bld-cat', 'pen-fishcage-empty', 'pen-fishcage-full', 'pen-crabpen-empty', 'pen-crabpen-full',
  'fish-seabass', 'fish-pomfret', 'fish-snapper', 'fish-grouper', 'sea-fish1-a', 'sea-fish1-b', 'sea-fish2-a', 'sea-fish2-b', 'sea-fish3-a', 'sea-fish3-b', 'sea-gull-a', 'sea-gull-b', 'sea-jelly-a', 'sea-jelly-b', 'sc-cloud1', 'sc-cloud2', 'sc-cloud3',
].forEach(n => { const im = new Image(); im.src = `sprites/${n}.png`; IMG[n] = im; });
const cv = document.getElementById('c'), g = cv.getContext('2d');
// backing store at an integer multiple of 640×360 so text renders sharp; sprites stay blocky via nearest sampling
function fit() { const k = Math.min(4, Math.max(1, Math.ceil(cv.getBoundingClientRect().width * devicePixelRatio / W))); cv.width = W * k; cv.height = H * k; g.setTransform(k, 0, 0, k, 0, 0); g.imageSmoothingEnabled = false; }
fit(); addEventListener('resize', fit);
const hits = [];
const hit = (x, y, w, h, fn) => hits.push({ x, y, w, h, fn });
const ready = n => { const im = IMG[n]; return im && im.complete && im.naturalWidth ? im : null; };
function text(s, x, y, color = C.sand, size = 8, align = 'left') { size = Math.max(size, 7); g.font = `${size}px monospace`; g.textAlign = align; g.fillStyle = '#0c0c0e'; g.fillText(s, x + 1, y + 1); g.fillStyle = color; g.fillText(s, x, y); g.textAlign = 'left'; }
function ell(x, y, rx, ry, color) { g.fillStyle = color; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); }
function sprite(name, x, y, { flip = false, alpha = 1, scale = 1 } = {}) {
  const im = typeof name === 'string' ? ready(name) : name; if (!im) return false;
  g.save(); g.globalAlpha = alpha; g.translate(Math.round(x), Math.round(y)); if (flip) g.scale(-1, 1);
  g.drawImage(im, -Math.round(im.width * scale / 2), -Math.round(im.height * scale), im.width * scale, im.height * scale); g.restore(); return true;
}
const TINTS = {};
function tinted(name, tint) {
  const im = ready(name); if (!im) return null; if (!tint) return im;
  const k = name + '|' + tint; if (TINTS[k]) return TINTS[k];
  const oc = document.createElement('canvas'); oc.width = im.width; oc.height = im.height; const og = oc.getContext('2d');
  og.drawImage(im, 0, 0); og.globalCompositeOperation = 'source-atop'; og.globalAlpha = 0.4; og.fillStyle = tint; og.fillRect(0, 0, oc.width, oc.height);
  return TINTS[k] = oc;
}
function glow(x, y, r, color, a) { if (a <= 0) return; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, color); gr.addColorStop(1, 'transparent'); g.globalAlpha = a; g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); g.globalAlpha = 1; }
function float(s, x, y, color = C.gold2, size = 8, ui = false) { A.floaters.push({ s, x, y, life: 1.6, color, size, ui }); }
function pop(x, y, color, n = 8) { for (let i = 0; i < n; i++) A.particles.push({ x, y, vx: rnd(-30, 30), vy: rnd(-60, 0), life: 0.6, color }); }
function hop(im, x, y) { if (im) A.hops.push({ im, x, y, vy: -90, life: 0.9 }); } // a sprite that jumps up and fades (harvest, crate)
function collect(id, n = 1) { const first = !S.album[id]; S.album[id] = (S.album[id] || 0) + n; if (first) { const e = ALBUM.find(a => a.id === id); float(`New in album: ${e ? e.name : id}`, W / 2, 120, C.gold, 10, true); SFX.stamp(); } }
function rollRare(wx, wy) {
  for (const [id, r] of Object.entries(RARE)) if (Math.random() < r.odds * (has('cat') ? 2 : 1)) { S.cash += r.cash; collect(id); hop(ready(r.sprite), wx, wy); float(`${r.label}! +S$${r.cash}`, wx, wy - 40, C.gold, 10); return; }
}
function fmt(s) { s = Math.max(0, Math.ceil(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`; }

// ---- iso maths: world px of a tile centre; screen = world - cam + screen centre ----
function center(r, c) { return { x: (c - r) * TW / 2, y: (c + r) * TH / 2 + TH / 2 }; }
const scr = (wx, wy) => [wx - cam.x + W / 2, wy - cam.y + H / 2];
function tilePos(r, c) { const p = center(r, c); return scr(p.x, p.y); }
function tileAt(sx, sy) {
  const wx = sx - W / 2 + cam.x, wy = sy - H / 2 + cam.y, u = wx / (TW / 2), v = (wy - TH / 2) / (TH / 2);
  const c = Math.round((u + v) / 2), r = Math.round((v - u) / 2); const p = center(r, c);
  if (Math.abs(wx - p.x) / (TW / 2) + Math.abs(wy - p.y) / (TH / 2) > 1) return null; return { r, c };
}
function diamond(x, y, w = TW, h = TH) { g.beginPath(); g.moveTo(x, y - h / 2); g.lineTo(x + w / 2, y); g.lineTo(x, y + h / 2); g.lineTo(x - w / 2, y); g.closePath(); }

// ---- update ----
function update(dt) {
  S.t += dt; breakPlanks(); stepActor(dt, F); idle(F, dt); for (const w of WK) { w.speed = has('dog') ? 1.2 : 1; stepActor(dt, w); think(w, dt); idle(w, dt); }
  const bed = S.objs.find(o => o.id === 'dog'); if (bed && !DOG) DOG = actor({ r: bed.r, c: bed.c, speed: 1.9 }); if (DOG) { stepActor(dt, DOG); dogThink(DOG, dt, bed); }
  for (const f of A.fish) { f.x += f.v * dt; if (f.x > 520) f.x = -520; if (f.x < -520) f.x = 520; if (Math.random() < 0.004) f.v = -f.v; }
  for (const j of A.jelly) { j.y -= 4 * dt; if (j.y < -20) j.y = 520; j.x += Math.sin(S.t + j.ph) * 3 * dt; }
  for (const b of A.gulls) { b.x += b.v * dt; if (b.x > W + 40) b.x = -40; if (b.x < -40) b.x = W + 40; }
  for (const c of A.clouds) { c.x += c.v * dt; if (c.x > W + 60) c.x = -80; }
  if (Math.random() < dt * 2) A.bubbles.push({ x: rnd(-500, 500), y: rnd(0, 520), v: rnd(8, 16), r: rnd(1, 2.5), life: 3 });
  for (const b of A.bubbles) { b.y -= b.v * dt; b.x += Math.sin(S.t * 3 + b.y) * 6 * dt; b.life -= dt; } A.bubbles = A.bubbles.filter(b => b.life > 0);
  for (const r of A.ripples) { r.r += 30 * dt; r.life -= dt * 1.2; } A.ripples = A.ripples.filter(r => r.life > 0);
  for (const f of A.floaters) { f.y -= 10 * dt; f.life -= dt * 0.8; } A.floaters = A.floaters.filter(f => f.life > 0);
  for (const p of A.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt; p.life -= dt; } A.particles = A.particles.filter(p => p.life > 0);
  for (const h of A.hops) { h.y += h.vy * dt; h.vy += 160 * dt; h.life -= dt; } A.hops = A.hops.filter(h => h.life > 0);
}
