<style>

  #wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
  canvas { width: 100%; image-rendering: pixelated; display: block; touch-action: none; border-radius: 6px; box-shadow: 0 20px 60px #000a; }

<body>
<div id="wrap"><canvas id="c" width="640" height="360"></canvas></div>
<script>
// ---- tuning ----
const SP = [ // oyster species: grow seconds, spat price, sale, xp, unlock level, tint
  { id: 'rock',     name: 'Rock',     time: 60,        cost: 5,   sell: 12,   xp: 3,   lvl: 1, tint: null },
  { id: 'pacific',  name: 'Pacific',  time: 5 * 60,    cost: 15,  sell: 45,   xp: 8,   lvl: 2, tint: '#7fb8d8' },
  { id: 'kumamoto', name: 'Kumamoto', time: 30 * 60,   cost: 40,  sell: 170,  xp: 25,  lvl: 4, tint: '#a8d8a0' },
  { id: 'pearl',    name: 'Pearl',    time: 4 * 3600,  cost: 150, sell: 900,  xp: 120, lvl: 6, tint: '#f1c4cf' },
  { id: 'belon',    name: 'Belon',    time: 12 * 3600, cost: 500, sell: 3500, xp: 400, lvl: 8, tint: '#c9a96e' },
];
const FISH = [ // what Singapore kelongs rear and wet markets sell; tap an empty fish cage to pick one
  { id: 'seabass', name: 'Seabass',    time: 20 * 60,   cost: 20,  sell: 90,   xp: 15,  lvl: 2 },
  { id: 'pomfret', name: 'Pomfret',    time: 3600,      cost: 50,  sell: 240,  xp: 35,  lvl: 3 },
  { id: 'snapper', name: 'Snapper',    time: 3 * 3600,  cost: 120, sell: 600,  xp: 90,  lvl: 4 },
  { id: 'grouper', name: 'Grouper',    time: 8 * 3600,  cost: 300, sell: 1600, xp: 250, lvl: 6 },
];
const fishOf = id => FISH.find(f => f.id === id);
const ITEMS = [ // buildable: on land or sea; pens have a feed→wait→collect cycle; effects are read where they apply
  { id: 'lantern',  name: 'Lantern',     cost: 60,   xp: 5,   lvl: 1, on: 'land', sprite: 'bld-lantern', note: 'wither -25%', desc: 'A ready oyster withers if left too long. A lantern gives you 25% more time to harvest it.' },
  { id: 'fishcage', name: 'Fish cage',   cost: 150,  xp: 10,  lvl: 2, on: 'sea',  sprite: 'pen-fishcage', pen: { feed: 20, time: 20 * 60, sell: 90, xp: 15, what: 'fish' }, note: 'rear 4 fish', desc: 'Pick what to rear: seabass, pomfret, snapper or grouper. Stock it, wait, collect the catch. Goes on open sea.' },
  { id: 'bench',    name: 'Bench',       cost: 80,   xp: 6,   lvl: 2, on: 'land', sprite: 'bld-bench', note: '+1 quest/day', desc: 'A fourth quest every day, so more coins and XP from the quest board.' },
  { id: 'palm',     name: 'Palm',        cost: 120,  xp: 10,  lvl: 2, on: 'land', sprite: 'bld-palm', note: '+5% sales ×3', desc: 'Each palm adds 5% to every sale. Up to three palms count.' },
  { id: 'crabpen',  name: 'Crab pen',    cost: 250,  xp: 15,  lvl: 3, on: 'land', sprite: 'pen-crabpen', pen: { feed: 40, time: 3600, sell: 220, xp: 35, what: 'crabs' }, note: 'crabs every 1h', desc: 'Feed it S$40, wait an hour, collect S$220 of crabs. Goes on the platform.' },
  { id: 'stall',    name: 'Market',      cost: 500,  xp: 40,  lvl: 3, on: 'land', sprite: 'bld-stall', note: '+10% sales', desc: 'Every oyster, fish and crab sale pays 10% more.' },
  { id: 'flag',     name: 'Flag',        cost: 200,  xp: 15,  lvl: 3, on: 'land', sprite: 'bld-flag', note: 'sampan -20%', desc: 'Sampan trips come back 20% sooner.' },
  { id: 'cat',      name: 'Cat',         cost: 300,  xp: 25,  lvl: 4, on: 'land', sprite: 'bld-cat', note: '2× rare finds', desc: 'Pearl and gold shell finds on harvest are twice as likely.' },
  { id: 'shed',     name: 'Shed',        cost: 800,  xp: 60,  lvl: 5, on: 'land', sprite: 'bld-shed', note: 'wither 2× slow', desc: 'Doubles the time a ready oyster waits before it withers.' },
  { id: 'cellar',   name: 'NILA cellar', cost: 400,  xp: 50,  lvl: 5, on: 'sea',  sprite: 'cellar', pen: { feed: 100, time: 6 * 3600, sell: 0, xp: 300, what: 'bottle', win: true }, note: 'age a bottle', desc: 'Lower a NILA bottle for S$100. Six real hours later it comes up sea-aged: the win.' },
];
const FIX = 20, BREAK_MS = 30 * 60 * 1000, MAX_BROKEN = 4; // a plank breaks every 30 real minutes, up to 4 holes
const WORKERS = [ // hired at the hut; one-off cost, they work forever
  { id: 'harvester', name: 'Harvester',  cost: 400, lvl: 3, note: 'harvests & clears', desc: 'Harvests ready oysters and clears withered ones for you, all day.' },
  { id: 'keeper',    name: 'Pen keeper', cost: 700, lvl: 4, note: 'feeds & collects pens', desc: 'Feeds empty fish cages and crab pens (feed comes from your coins) and collects them when ready.' },
  { id: 'carpenter', name: 'Carpenter',  cost: 600, lvl: 4, note: 'fixes broken planks', desc: 'Fixes broken planks on his own, S$20 each from your coins.' },
];
const EXPAND = { 4: [150, 2], 5: [500, 4], 6: [1500, 6], 7: [4000, 8] };
const ALBUM = [ // collection book entries; counts live in S.album
  ...SP.map(s => ({ id: s.id, name: s.name, icon: () => tinted('oyster-fat-idle', s.tint) })),
  ...FISH.map(f => ({ id: f.id, name: f.name, icon: () => ready(`fish-${f.id}`) })), { id: 'crabs', name: 'Crabs', icon: () => ready('sea-crab-a') }, { id: 'bottle', name: 'NILA', icon: () => ready('bottle-3') },
  { id: 'rarepearl', name: 'Pearl drop', icon: () => ready('sp-pearl'), rare: true }, { id: 'gold', name: 'Gold shell', icon: () => ready('sp-gold'), rare: true },
];
const RARE = { rarepearl: { odds: 0.05, cash: 60, sprite: 'sp-pearl', label: 'pearl' }, gold: { odds: 0.01, cash: 400, sprite: 'sp-gold', label: 'GOLD' } }; // per harvest
const BOAT = { r: 5, c: 7, trips: [{ h: 2, cost: 30, cash: 150, xp: 20 }, { h: 8, cost: 100, cash: 800, xp: 90 }] };
const NILA_LINK = 'https://nila.wine';
const W = 640, H = 360, TW = 64, TH = 32, MAP = 16, R0 = 4, C0 = 8, MAXN = 7, daySeconds = 300, WALK = 2.6;
const lvlXp = L => L <= 1 ? 0 : Math.round(30 * Math.pow(L - 1, 1.7));
const C = { sand: '#f5f0e8', gold: '#c9a96e', gold2: '#d4bc8a', deep: '#a8884f', ink: '#0c0c0e', pink: '#f1c4cf', green: '#5f9a6a', wood: '#6b4f3a', wood2: '#8a6a4a', grey: '#8a9ab0' };
const rnd = (a, b) => a + Math.random() * (b - a);
// how each job looks while the actor stands and works: duration, beat between bursts, particles, sound, held tool
const WORK = {
  feed:    { t: 0.9, beat: 0.3,  n: 4, y: 14, col: ['#a8884f', '#8a6a3a'], sfx: () => SFX.chomp(), tool: 'bucket', anim: ['feed-a', 'feed-b'] },
  collect: { t: 0.9, beat: 0.3,  n: 3, y: 18, col: ['#f6d48a', '#ffffff'], sfx: () => SFX.pop(),   tool: 'basket', anim: ['harvest-a', 'harvest-b'] },
  fix:     { t: 1.4, beat: 0.35, n: 5, y: 4,  col: ['#d9b48a', '#c0c0c0', '#8a5a3a'], sfx: () => SFX.tok(), tool: 'hammer', anim: ['hammer-a', 'hammer-b'] },
  plant:   { t: 0.6, beat: 0.3,  n: 4, y: 2,  col: ['#9ad0e0', '#e8f4ff'], sfx: () => SFX.splash(), tool: 'oyster', anim: ['plant'] },
  harvest: { t: 0.7, beat: 0.35, n: 4, y: 2,  col: ['#9ad0e0', '#e8f4ff'], sfx: () => SFX.splash(), tool: 'basket', anim: ['harvest-a', 'harvest-b'] },
  sweep:   { t: 1.6, beat: 0.4,  n: 2, y: 2,  col: ['#d9b48a'], sfx: () => {}, tool: 'broom', anim: ['sweep'] },
};

// ---- map: a kelong island top-left, a deck, the raft growing to the lower right ----
const land = (r, c) => r >= 1 && c >= 1 && r <= 6 && c <= 6 && r + c <= 10;
const deck = (r, c) => r === 4 && c === 7;
const raft = (r, c) => r >= R0 && c >= C0 && r < R0 + S.n && c < C0 + S.n;
const raftZone = (r, c) => r >= R0 && c >= C0 && r < R0 + MAXN && c < C0 + MAXN;
const HUT = { r: 2, c: 2 }; // 2×2 footprint ending at this tile
const hutTile = (r, c) => r >= 1 && r <= 2 && c >= 1 && c <= 2;
const isBroken = (r, c) => S.broken.some(([i, j]) => i === r && j === c);
const walkable = (r, c) => (land(r, c) && !isBroken(r, c)) || deck(r, c) || raft(r, c);
const inMap = (r, c) => r >= 0 && c >= 0 && r < MAP && c < MAP;

const S = load() || {
  cash: 40, xp: 0, level: 1, n: 3, plots: Array.from({ length: MAXN }, () => Array(MAXN).fill(null)),
  objs: [], bottles: 0, won: false, step: 0, quests: [], questDay: '', stats: { harvest: {}, collect: 0, built: 0 },
  farmer: { r: 3, c: 4 }, cam: null, album: {}, boat: { out: null, trip: 0 }, broken: [], lastBreak: Date.now(),
};
S.broken = S.broken || []; S.lastBreak = S.lastBreak || Date.now();
S.album = S.album || {}; S.boat = S.boat || { out: null, trip: 0 };
const actor = w => Object.assign({ queue: [], walk: 0, back: false, flip: false, moving: false, think: 0 }, w);
const WK = (S.workers || []).map(actor); S.workers = WK;
Object.assign(S, { t: daySeconds * 0.75, pick: null, pickFish: null, build: null, panel: null });
const F = Object.assign({ tr: null, tc: null, queue: [], walk: 0, back: false, flip: false, moving: false }, S.farmer); S.farmer = F;
const cam = S.cam || { x: 60, y: 150 }; S.cam = cam;
const A = { fish: [], jelly: [], bubbles: [], ripples: [], floaters: [], particles: [], gulls: [], clouds: [], hops: [] };
for (let i = 0; i < 14; i++) A.fish.push({ kind: 1 + (i % 3), x: rnd(-500, 500), y: rnd(0, 500), v: rnd(10, 26) * (Math.random() < 0.5 ? 1 : -1), ph: rnd(0, 6) });
for (let i = 0; i < 3; i++) A.jelly.push({ x: rnd(-400, 400), y: rnd(100, 450), ph: rnd(0, 6) });
for (let i = 0; i < 3; i++) A.gulls.push({ x: rnd(0, W), y: rnd(20, 120), v: rnd(14, 22) * (i % 2 ? -1 : 1), ph: rnd(0, 6) });
[['cloud1', 40, 40, 3], ['cloud2', 300, 70, 2], ['cloud3', 520, 30, 4]].forEach(([k, x, y, v]) => A.clouds.push({ k, x, y, v }));

function load() { try { return JSON.parse(localStorage.getItem('indigo-farm-v2')); } catch { return null; } }
function save() { try { const { t, pick, pickFish, build, panel, ...rest } = S; rest.farmer = { r: F.r, c: F.c }; rest.workers = WK.map(w => ({ id: w.id, r: w.r, c: w.c })); localStorage.setItem('indigo-farm-v2', JSON.stringify(rest)); } catch {} }

// ---- sprites ----
const IMG = {};
['oyster-baby-idle', 'oyster-baby-blink', 'oyster-medium-idle', 'oyster-medium-blink', 'oyster-fat-idle', 'oyster-fat-blink', 'sp-withered', 'sp-pearl', 'sp-gold', 'sea-crab-a', 'customer-wait', 'customer-happy',
  'hut-hut', 'bottle-0', 'bottle-1', 'bottle-2', 'bottle-3', 'win', 'farmer-front-idle', 'farmer-front-walk', 'farmer-back-idle', 'farmer-back-walk', 'farmer-work-hammer-a', 'farmer-work-hammer-b', 'farmer-work-feed-a', 'farmer-work-feed-b', 'farmer-work-harvest-a', 'farmer-work-harvest-b', 'farmer-work-plant', 'farmer-work-sweep',
  ...['carpenter', 'keeper', 'harvester'].flatMap(w => ['front-idle', 'front-walk', 'back-idle', 'back-walk', 'work-a', 'work-b'].map(f => `wk-${w}-${f}`)),
  'bld-stall', 'bld-shed', 'bld-lantern', 'bld-flag', 'bld-palm', 'bld-bench', 'bld-cat', 'pen-fishcage-empty', 'pen-fishcage-full', 'pen-crabpen-empty', 'pen-crabpen-full',
  'fish-seabass', 'fish-pomfret', 'fish-snapper', 'fish-grouper', 'sea-fish1-a', 'sea-fish1-b', 'sea-fish2-a', 'sea-fish2-b', 'sea-fish3-a', 'sea-fish3-b', 'sea-gull-a', 'sea-gull-b', 'sea-jelly-a', 'sea-jelly-b', 'sc-cloud1', 'sc-cloud2', 'sc-cloud3',
].forEach(n => { const im = new Image(); im.src = `sprites/${n}.png`; IMG[n] = im; });
const cv = document.getElementById('c'), g = cv.getContext('2d');
// backing store at an integer multiple of 640×360 so text renders sharp; sprites stay blocky via nearest sampling
function fit() { const k = Math.min(4, Math.max(1, Math.ceil(cv.getBoundingClientRect().width * devicePixelRatio / W))); cv.width = W * k; cv.height = H * k; g.setTransform(k, 0, 0, k, 0, 0); g.imageSmoothingEnabled = false; }
fit(); addEventListener('resize', fit);
const hits = [];
const hit = (x, y, w, h, fn) => hits.push({ x, y, w, h, fn });
const ready = n => { const im = IMG[n]; return im && im.complete && im.naturalWidth ? im : null; };
function text(s, x, y, color = C.sand, size = 8, align = 'left') { size = Math.max(size, 7); g.font = `${size}px monospace`; g.textAlign = align; g.fillStyle = '#0c0c0e'; g.fillText(s, x + 1, y + 1); g.fillStyle = color; g.fillText(s, x, y); g.textAlign = 'left'; }
function ell(x, y, rx, ry, color) { g.fillStyle = color; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); }
function sprite(name, x, y, { flip = false, alpha = 1, scale = 1 } = {}) {
  const im = typeof name === 'string' ? ready(name) : name; if (!im) return false;
  g.save(); g.globalAlpha = alpha; g.translate(Math.round(x), Math.round(y)); if (flip) g.scale(-1, 1);
  g.drawImage(im, -Math.round(im.width * scale / 2), -Math.round(im.height * scale), im.width * scale, im.height * scale); g.restore(); return true;
}
const TINTS = {};
function tinted(name, tint) {
  const im = ready(name); if (!im) return null; if (!tint) return im;
  const k = name + '|' + tint; if (TINTS[k]) return TINTS[k];
  const oc = document.createElement('canvas'); oc.width = im.width; oc.height = im.height; const og = oc.getContext('2d');
  og.drawImage(im, 0, 0); og.globalCompositeOperation = 'source-atop'; og.globalAlpha = 0.4; og.fillStyle = tint; og.fillRect(0, 0, oc.width, oc.height);
  return TINTS[k] = oc;
}
function glow(x, y, r, color, a) { if (a <= 0) return; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, color); gr.addColorStop(1, 'transparent'); g.globalAlpha = a; g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); g.globalAlpha = 1; }
function float(s, x, y, color = C.gold2, size = 8, ui = false) { A.floaters.push({ s, x, y, life: 1.6, color, size, ui }); }
function pop(x, y, color, n = 8) { for (let i = 0; i < n; i++) A.particles.push({ x, y, vx: rnd(-30, 30), vy: rnd(-60, 0), life: 0.6, color }); }
function hop(im, x, y) { if (im) A.hops.push({ im, x, y, vy: -90, life: 0.9 }); } // a sprite that jumps up and fades (harvest, crate)
function collect(id, n = 1) { const first = !S.album[id]; S.album[id] = (S.album[id] || 0) + n; if (first) { const e = ALBUM.find(a => a.id === id); float(`New in album: ${e ? e.name : id}`, W / 2, 120, C.gold, 10, true); SFX.stamp(); } }
function rollRare(wx, wy) {
  for (const [id, r] of Object.entries(RARE)) if (Math.random() < r.odds * (has('cat') ? 2 : 1)) { S.cash += r.cash; collect(id); hop(ready(r.sprite), wx, wy); float(`${r.label}! +S$${r.cash}`, wx, wy - 40, C.gold, 10); return; }
}
function fmt(s) { s = Math.max(0, Math.ceil(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`; }

// ---- iso maths: world px of a tile centre; screen = world - cam + screen centre ----
function center(r, c) { return { x: (c - r) * TW / 2, y: (c + r) * TH / 2 + TH / 2 }; }
const scr = (wx, wy) => [wx - cam.x + W / 2, wy - cam.y + H / 2];
function tilePos(r, c) { const p = center(r, c); return scr(p.x, p.y); }
function tileAt(sx, sy) {
  const wx = sx - W / 2 + cam.x, wy = sy - H / 2 + cam.y, u = wx / (TW / 2), v = (wy - TH / 2) / (TH / 2);
  const c = Math.round((u + v) / 2), r = Math.round((v - u) / 2); const p = center(r, c);
  if (Math.abs(wx - p.x) / (TW / 2) + Math.abs(wy - p.y) / (TH / 2) > 1) return null; return { r, c };
}
function diamond(x, y, w = TW, h = TH) { g.beginPath(); g.moveTo(x, y - h / 2); g.lineTo(x + w / 2, y); g.lineTo(x, y + h / 2); g.lineTo(x - w / 2, y); g.closePath(); }
const species = id => SP.find(s => s.id === id);
const item = id => ITEMS.find(i => i.id === id);
const objAt = (r, c) => S.objs.find(o => o.r === r && o.c === c);
const penSpec = o => { const it = item(o.id), f = it.id === 'fishcage' && o.sp && fishOf(o.sp); return f ? { feed: f.cost, time: f.time, sell: f.sell, xp: f.xp, what: f.id } : it.pen; };
const has = id => S.objs.some(o => o.id === id), count = id => S.objs.filter(o => o.id === id).length;
const growth = p => (Date.now() - p.at) / 1000 / species(p.sp).time;
const withered = p => growth(p) >= 1 + 2 * (has('shed') ? 2 : 1) * (has('lantern') ? 1.25 : 1);
const sellMul = () => (has('stall') ? 1.1 : 1) + 0.05 * Math.min(3, count('palm'));

// ---- farmer: walks in a straight line to the task tile, then does it ----
// ponytail: no pathfinding; island + deck + raft are convex enough that straight lines rarely cross open sea. BFS if it bothers anyone.
function nearestWalkable(r, c) {
  if (walkable(r, c)) return [r, c]; let best = null, bd = 1e9;
  for (let i = 0; i < MAP; i++) for (let j = 0; j < MAP; j++) if (walkable(i, j) && !hutTile(i, j)) { const d = Math.abs(i - r) + Math.abs(j - c); if (d < bd) { bd = d; best = [i, j]; } }
  return best;
}
function go(r, c, fn, who = F, kind = null) { const [tr, tc] = nearestWalkable(r, c); who.queue = who.queue.filter(q => !q.idle); who.queue.push({ tr, tc, fn, face: kind ? [r, c] : null, act: kind ? WORK[kind].t : 0, kind }); }
const head = who => { const w = center(who.r, who.c), [x, y] = scr(w.x, w.y); return [x, y - 46]; };
// walk to a free tile next to (r,c), face it, then "work" for a moment before fn fires
function goBeside(r, c, fn, who = F, kind = 'feed') {
  const nb = [[1, 0], [0, 1], [-1, 0], [0, -1]].map(([a, b]) => [r + a, c + b]).filter(([i, j]) => walkable(i, j) && !objAt(i, j) && !hutTile(i, j));
  const [tr, tc] = nb.length ? nb.sort((a, b) => Math.hypot(a[0] - who.r, a[1] - who.c) - Math.hypot(b[0] - who.r, b[1] - who.c))[0] : nearestWalkable(r, c);
  who.queue = who.queue.filter(q => !q.idle); who.queue.push({ tr, tc, fn, face: [r, c], act: WORK[kind].t, kind });
}
// nobody stands still: every few idle seconds an actor looks around, wanders a few planks, or sweeps the deck
function idle(a, dt) {
  if (a.queue.length || (a.idle = (a.idle || 0) - dt) > 0) return; a.idle = rnd(2.5, 6);
  const r0 = Math.round(a.r), c0 = Math.round(a.c), roll = Math.random();
  if (roll < 0.35) { a.flip = !a.flip; return; }
  if (roll < 0.6 && land(r0, c0)) { a.queue.push({ tr: r0, tc: c0, fn: () => {}, face: [r0 + (a.back ? -1 : 1), c0], act: WORK.sweep.t, kind: 'sweep', idle: true }); return; }
  const cand = []; for (let r = r0 - 3; r <= r0 + 3; r++) for (let c = c0 - 3; c <= c0 + 3; c++) if ((r !== r0 || c !== c0) && inMap(r, c) && walkable(r, c) && !objAt(r, c) && !hutTile(r, c) && path(r0, c0, r, c)) cand.push([r, c]);
  if (cand.length) { const [r, c] = cand[Math.floor(Math.random() * cand.length)]; a.queue.push({ tr: r, tc: c, fn: () => {}, act: 0, idle: true }); }
}
// shortest tile path over land/deck/raft (BFS, 4-neighbour); null if unreachable
function path(r0, c0, r1, c1) {
  const ok = (r, c) => inMap(r, c) && walkable(r, c) && !hutTile(r, c), key = (r, c) => r * MAP + c, prev = new Map([[key(r0, c0), null]]), q = [[r0, c0]];
  while (q.length) { const [r, c] = q.shift(); if (r === r1 && c === c1) { const out = []; for (let k = key(r, c); k !== null; k = prev.get(k)) out.unshift([Math.floor(k / MAP), k % MAP]); return out.slice(1); }
    for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nr = r + a, nc = c + b; if (ok(nr, nc) && !prev.has(key(nr, nc))) { prev.set(key(nr, nc), key(r, c)); q.push([nr, nc]); } } }
  return null;
}
function stepActor(dt, F) {
  if (!F.queue.length) { F.moving = false; return; }
  const q = F.queue[0];
  if (!q.path) { const p = path(Math.round(F.r), Math.round(F.c), q.tr, q.tc); if (!p) { F.queue.shift(); float('fix the planks first', ...head(F), C.pink); SFX.nope(); return; } q.path = p; }
  const [wr, wc] = q.path.length ? q.path[0] : [q.tr, q.tc], dr = wr - F.r, dc = wc - F.c, d = Math.hypot(dr, dc);

function drawAlbum() {

  const found = ALBUM.filter(a => S.album[a.id]).length; text(`Album  ${found}/${ALBUM.length}`, x0, y0 + 12, C.gold2, 8);
  ALBUM.forEach((a, i) => {

    if (im) { const s = Math.min(1, 28 / im.height, 40 / im.width); g.globalAlpha = n ? 1 : 0.12; g.drawImage(im, Math.round(x - im.width * s / 2), Math.round(y + 30 - im.height * s), Math.round(im.width * s), Math.round(im.height * s)); g.globalAlpha = 1; }

    text(n ? a.name : '???', x, y + 40, n ? (a.rare ? C.gold : C.sand) : C.grey, 6, 'center'); if (n) text(`×${n}`, x, y + 48, C.gold2, 6, 'center');
  });
}
function drawHutPanel() {
  const cards = [{ name: 'Daily gift', sub: giftReady() ? `S$${25 * S.level} · +10xp · tap to claim` : 'claimed · back tomorrow', desc: 'Free coins once a real day. Worth more at higher levels.', fn: claimGift, ok: giftReady() },
    ...WORKERS.map((k, i) => { const hired = WK.some(w => w.id === k.id), locked = S.level < k.lvl; return { name: k.name, sub: hired ? 'hired, working for you' : locked ? `unlocks at level ${k.lvl}` : `hire for S$${k.cost}, once`, desc: k.desc, fn: () => hire(i), ok: !hired && !locked && S.cash >= k.cost, id: k.id }; })];
  const w = 156, h = 76, x0 = W / 2 - cards.length * w / 2, y0 = H / 2 - 56; panelBox(x0 - 6, y0, cards.length * w + 12, h + 30); text('Kelong hut', W / 2, y0 + 14, C.gold2, 8, 'center');
  cards.forEach((k, i) => {
    const x = x0 + i * w + 6, tx = x + (k.id ? 34 : 6); g.fillStyle = '#1a2a40'; g.fillRect(x, y0 + 22, w - 12, h);
    if (k.id) sprite(`wk-${k.id}-front-idle`, x + 17, y0 + 70);
    text(k.name, tx, y0 + 34, C.sand, 8); text(k.sub, tx, y0 + 45, k.ok ? C.gold2 : C.grey, 7);
    wrap(k.desc, w - 12 - (tx - x) - 4).forEach((l, j) => text(l, tx, y0 + 57 + j * 9, C.grey, 7));

}
function drawBoatPanel() {
  const w = 150, x0 = W / 2 - w, y0 = H / 2 - 40; panelBox(x0 - 6, y0, w * 2 + 12, 80); text('Send the sampan out', W / 2, y0 + 14, C.gold2, 8, 'center');
  BOAT.trips.forEach((tr, i) => {
    const x = x0 + i * w + w / 2; g.fillStyle = '#1a2a40'; g.fillRect(x - w / 2 + 6, y0 + 22, w - 12, 50);
    text(`${tr.h} hour trip`, x, y0 + 38, C.sand, 8, 'center'); text(`costs S$${tr.cost}`, x, y0 + 50, S.cash < tr.cost ? C.pink : C.gold2, 7, 'center'); text(`crate ≈ S$${tr.cash} · +${tr.xp}xp`, x, y0 + 62, C.grey, 6, 'center');
    hit(x - w / 2 + 6, y0 + 22, w - 12, 50, () => sendBoat(i));

}
function drawQuests() {
  panelBox(W - 230, 22, 220, 34 + 14 * S.quests.length); text('Today\'s quests', W - 220, 36, C.gold2, 8);
  S.quests.forEach((q, i) => { const y = 50 + i * 14, p = questProg(q); text(q.text, W - 220, y, C.sand, 7); text(`${p}/${q.n}`, W - 80, y, p >= q.n ? C.gold : C.grey, 7, 'right'); text(`S$${q.cash} +${q.xp}xp`, W - 18, y, C.gold2, 6, 'right'); });
}
function draw() {
  hits.length = 0; const t = S.t, D = sky();
  g.fillStyle = D.sea; g.fillRect(0, 0, W, H);
  drawWorld(t, D);
  // time of day tint, then sky-layer life (gulls, clouds) in screen space
  g.fillStyle = D.tint; g.globalAlpha = D.ta; g.fillRect(0, 0, W, H); g.globalAlpha = 1;
  for (const c of A.clouds) sprite(`sc-${c.k}`, c.x, c.y, { alpha: 0.5, scale: 1.5 });
  for (const b of A.gulls) sprite(Math.floor(t * 6 + b.ph) % 2 ? 'sea-gull-a' : 'sea-gull-b', b.x, b.y + Math.sin(t * 2 + b.ph) * 3, { flip: b.v < 0 });

  if (S.pick) drawPicker(SP, sp => tinted('oyster-fat-idle', sp.tint), plant);
  if (S.pickFish) drawPicker(FISH, f => ready(`fish-${f.id}`), f => stockFish(S.pickFish, f, F));

  if (S.panel === 'quests') drawQuests();
  if (S.panel === 'album') drawAlbum();
  if (S.panel === 'boat') drawBoatPanel();
  if (S.panel === 'hut') drawHutPanel();
  for (const f of A.floaters) if (f.ui) { g.globalAlpha = Math.min(1, f.life); text(f.s, f.x, f.y, f.color, f.size, 'center'); } g.globalAlpha = 1;
  g.fillStyle = '#0c0c0eb0'; g.fillRect(0, 0, W, 18);
  text(`S$${S.cash}`, 8, 13, C.gold2, 11);
  const a = lvlXp(S.level), b = lvlXp(S.level + 1), k = (S.xp - a) / (b - a);
  text(`Lv ${S.level}`, 150, 13, C.sand, 9, 'right'); g.fillStyle = '#2b3a50'; g.fillRect(156, 6, 80, 6); g.fillStyle = '#9ad0e0'; g.fillRect(156, 6, Math.round(80 * k), 6); text(`${S.xp}/${b}`, 242, 13, C.grey, 7);
  text(`${S.n}×${S.n} raft`, 300, 13, C.sand, 8, 'center'); if (S.bottles) text(`🍾 ${S.bottles}`, 350, 13, C.gold2, 8, 'center');
  const btn = (x, label, on, fn) => { g.fillStyle = on ? C.gold2 : '#2b3a50'; g.fillRect(x, 3, 54, 12); text(label, x + 27, 12, on ? C.ink : C.sand, 7, 'center'); hit(x, 0, 54, 18, fn); };
  btn(410, 'album', S.panel === 'album', () => { S.panel = S.panel === 'album' ? null : 'album'; S.build = null; SFX.pop(); });
  btn(470, 'quests', S.panel === 'quests', () => { S.panel = S.panel === 'quests' ? null : 'quests'; S.build = null; SFX.pop(); });
  btn(530, 'build', S.panel === 'build', () => { S.panel = S.panel === 'build' ? null : 'build'; S.build = null; S.pick = null; SFX.pop(); });
  text(muted ? '♪̸' : '♪', 620, 13, muted ? '#777' : C.gold2, 11, 'center'); hit(606, 0, 30, 18, toggleMute);
  if (S.won) {
    if (ready('win')) g.drawImage(IMG.win, 0, 0, W, H); else { g.fillStyle = '#0c0c0ed0'; g.fillRect(0, 0, W, H); }
    text('Six months beneath the waves.', W / 2, 44, C.gold2, 18, 'center'); text('Your NILA bottle is ready.', W / 2, 66, C.sand, 11, 'center');
    g.fillStyle = C.ink + 'cc'; g.fillRect(20, 320, 140, 24); text('Reserve a bottle', 90, 336, C.gold, 10, 'center'); hit(20, 320, 140, 24, () => window.open(NILA_LINK, '_blank'));
    g.fillRect(480, 320, 140, 24); text('Keep farming', 550, 336, C.sand, 10, 'center'); hit(480, 320, 140, 24, () => { S.won = false; });
  }
}

// ---- input: drag pans the camera, a short press taps ----
let press = null;
const toCanvas = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
cv.addEventListener('pointerleave', () => { hover = null; });
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); const [x, y] = toCanvas(e); press = { x, y, cx: cam.x, cy: cam.y, drag: false }; audio(); });
let hover = null;
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { const [hx, hy] = toCanvas(e); hover = { x: hx, y: hy }; }
  if (!press) return; const [x, y] = toCanvas(e), dx = x - press.x, dy = y - press.y;
  if (!press.drag && Math.hypot(dx, dy) > 6) press.drag = true;
  if (press.drag) { cam.x = Math.max(-(MAP - 2) * TW / 2, Math.min((MAP - 2) * TW / 2, press.cx - dx)); cam.y = Math.max(TH * 2, Math.min((MAP - 1) * TH, press.cy - dy)); }
});
cv.addEventListener('pointerup', e => {
  if (!press) return; const was = press; press = null; if (was.drag) { save(); return; }
  const x = was.x, y = was.y, h = [...hits].reverse().find(h => x >= h.x && x < h.x + h.w && y >= h.y && y < h.y + h.h);
  if (h) { h.fn(); save(); return; }
  if (S.won) return;
  if (S.pick || S.pickFish) { S.pick = null; S.pickFish = null; return; }
  const tl = tileAt(x, y);
  if (tl && inMap(tl.r, tl.c)) { tapTile(tl.r, tl.c); save(); return; }
  const wx = x - W / 2 + cam.x, wy = y - H / 2 + cam.y; A.ripples.push({ x: wx, y: wy, r: 2, life: 1 }); SFX.splash();
});
refreshQuests();
{ breakPlanks(); let n = 0; for (const row of S.plots) for (const p of row) if (p && growth(p) >= 1 && !withered(p)) n++; const w = S.plots.flat().filter(p => p && withered(p)).length, b = S.broken.length; if (n || w || b) setTimeout(() => float([n && `${n} ready`, w && `${w} withered`, b && `${b} planks to fix`].filter(Boolean).join(', ') + ' while you were away', W / 2, 100, C.gold, 10, true), 600); }
let last = performance.now();
(function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(loop); })(last);
</script>
